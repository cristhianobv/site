<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Repetindo a coleta — primeiros passos com while em C</title>
<style>
:root{--bg:#f3f6f5;--paper:#fff;--ink:#20352f;--muted:#52665e;--green:#16634d;--soft:#eaf5ef;--line:#cbd9d2;--amber:#fff4db;--amberline:#ad7300;--blue:#eef5ff;--blueline:#3d6ea8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 16px;background:#fff;color:var(--ink);min-height:46px}button:hover{border-color:var(--green);background:var(--soft)}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--green);color:#fff;border-color:var(--green)}button.primary:hover{background:#0f513f}:focus-visible{outline:3px solid #b06900;outline-offset:3px}
header,main,footer{max-width:900px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:16px;font-weight:800}.teacher{display:block;font-weight:500;color:var(--muted);font-size:15px}.tools{display:flex;gap:8px}.tools button{font-size:15px;padding:7px 11px}main{padding-top:4px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,38px);box-shadow:0 8px 28px #20352f08}h1{font-size:clamp(27px,4vw,38px);line-height:1.2;margin:8px 0 18px}h2{font-size:23px;line-height:1.3}.phase{font-size:14px;font-weight:800;color:var(--green);background:var(--soft);border-radius:99px;padding:5px 10px}progress{width:100%;height:10px;accent-color:var(--green);margin:14px 0 20px}.small{font-size:15px;color:var(--muted)}.note,.tip,.feedback{padding:12px 15px;border-radius:8px;margin:16px 0}.note{background:var(--soft);border-left:5px solid var(--green)}.tip{background:var(--blue);border-left:5px solid var(--blueline)}.feedback{background:var(--amber);border-left:5px solid var(--amberline)}.feedback.good{background:var(--soft);border-color:var(--green)}.options{display:grid;gap:10px;margin:18px 0}.option{display:flex;align-items:flex-start;gap:12px;border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}.option:has(input:checked){border-color:var(--green);background:var(--soft)}input[type=radio]{width:21px;height:21px;accent-color:var(--green);flex:none;margin-top:3px}pre,.code{background:#182b25;color:#f4faf6;padding:17px;border-radius:10px;overflow:auto;font:16px/1.55 Consolas,monospace}.actions,nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}nav{justify-content:space-between}nav button{min-width:115px}.order-list{display:grid;gap:9px;margin:18px 0}.order-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:9px 10px 9px 13px}.order-code{font:16px Consolas,monospace;white-space:pre-wrap}.order-item button{min-height:38px;padding:5px 10px}.counter{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:20px 0}.counter-box{text-align:center;border:2px solid var(--line);border-radius:12px;padding:12px 22px;background:#fff}.counter-box strong{display:block;font-size:32px}.counter-box span{font:15px Consolas,monospace;color:var(--green)}.output{min-height:50px;background:#182b25;color:#fff;border-radius:10px;padding:12px 16px;font:16px Consolas,monospace;white-space:pre-wrap}.score{font-weight:800}.actions .secondary{background:transparent}footer{text-align:center;font-size:14px;color:var(--muted)}footer a{color:var(--green)}dialog{border:1px solid var(--line);border-radius:14px;max-width:480px;width:90%;padding:22px;color:var(--ink)}dialog::backdrop{background:#152a2477}
@media(max-width:560px){body{font-size:18px}header,main,footer{padding:14px}.order-item{grid-template-columns:1fr}.order-item div:last-child{justify-self:end}}
</style>
</head>
<body>
<header><div class="brand">PROGRAMAÇÃO I · C<span class="teacher">Prof. Cristhiano Vasconcellos</span></div><div class="tools"><button id="summaryTop">Meu percurso</button><button id="restart">Recomeçar</button></div></header>
<main id="main"></main>
<footer><p>Seu progresso fica salvo neste navegador. Você pode parar e continuar depois.</p><a href="index.html" id="backLink">Voltar à lista de atividades</a></footer>
<dialog id="restartDialog"><h2>Começar novamente?</h2><p>O progresso salvo será apagado.</p><div class="actions"><button id="cancelRestart">Continuar atividade</button><button class="primary" id="confirmRestart">Apagar e recomeçar</button></div></dialog>
<noscript>Ative o JavaScript para usar esta atividade.</noscript>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id), KEY="repetindo-coleta-while-v1", DESTINO="cristhiano.vasconcellos@iffarroupilha.edu.br", TITLE="Repetindo a coleta — primeiros passos com while em C";
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fresh=()=>({version:1,page:0,name:"",records:{},demo:0,started:new Date().toISOString()});let state=fresh(),busy=false;
try{const x=JSON.parse(localStorage.getItem(KEY));if(x?.version===1&&x.records&&Number.isInteger(x.page))state={...fresh(),...x};}catch(_){ }
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(_){}}
const screens=[
 {title:"Repetindo a coleta",kind:"intro",phase:"Comece por aqui"},
 {title:"O que o while faz?",kind:"quiz",id:"q1",phase:"Entender",q:"O while serve para…",opts:["repetir enquanto a condição for verdadeira","criar uma variável","mostrar uma mensagem"],correct:0,ok:"Isso! Ele repete enquanto a condição for verdadeira.",hint:"A palavra while indica “enquanto”.",help:"A resposta é: repetir enquanto a condição for verdadeira."},
 {title:"A condição está verdadeira?",kind:"quiz",id:"q2",phase:"Entender",q:"contador vale 3. A condição contador <= 3 é verdadeira?",opts:["Sim","Não"],correct:0,ok:"Sim. 3 é igual a 3.",hint:"O sinal <= significa menor ou igual.",help:"Sim. A condição 3 <= 3 é verdadeira."},
 {title:"Veja o contador avançar",kind:"demo",phase:"Experimentar"},
 {title:"Organize o código",kind:"order",id:"q3",phase:"Praticar",blocks:["int contador = 1;","while (contador <= 3) {",'    printf("%d\\n", contador);',"    contador++;","}"],hint:"Comece criando e iniciando o contador.",help:"Ordem: criar o contador, testar while, mostrar o valor, avançar o contador e fechar as chaves."},
 {title:"Qual linha faz avançar?",kind:"quiz",id:"q4",phase:"Praticar",q:"Qual comando aumenta o contador?",opts:["contador++","printf","while"],correct:0,ok:"Isso! contador++ aumenta o valor em 1.",hint:"Procure o comando que soma 1.",help:"A resposta é contador++. Ele aumenta o valor em 1."},
 {title:"O que está faltando?",kind:"quiz",id:"q5",phase:"Praticar",q:"Para o while parar, o programa precisa…",opts:["atualizar o contador","mostrar duas mensagens","criar outra variável"],correct:0,ok:"Certo. O contador muda até a condição ficar falsa.",hint:"Sem mudar, a condição pode continuar verdadeira.",help:"A resposta é atualizar o contador, usando contador++."},
 {title:"Missão final",kind:"mission",id:"mission",phase:"Missão"}
];
function doneCount(){return Object.values(state.records).filter(r=>r.solved).length}
function score(){let got=0,total=0,hints=0,helps=0;for(const s of screens){if(!s.id)continue;total++;const r=state.records[s.id];if(r){got+=r.first||0;hints+=r.hints||0;helps+=r.helps||0}}return{got,total,hints,helps,solved:doneCount()}}
function shell(s,body,nav=true){const i=state.page,prog=Math.round(i/(screens.length-1)*100);$("main").innerHTML=`<section class="card"><div class="phase">${esc(s.phase||"")}</div><progress value="${i+1}" max="${screens.length}" aria-label="Progresso"></progress><h1>${esc(s.title)}</h1>${body}${nav?`<nav><button id="prev" ${i===0?"disabled":""}>Voltar</button><button id="next" class="primary">${i===screens.length-1?"Ver meu percurso":"Continuar"}</button></nav>`:""}</section>`;if(nav){$("prev").onclick=()=>go(-1);$("next").onclick=()=>i===screens.length-1?summary():go(1)}}
function go(delta){state.page=Math.max(0,Math.min(screens.length-1,state.page+delta));save();render()}
function record(s,correct){const r=state.records[s.id]||{tries:0,hints:0,helps:0,solved:false};r.tries++;if(r.tries===1)r.first=correct?1:0;if(correct)r.solved=true;state.records[s.id]=r;save();return r}
function renderIntro(s){shell(s,`<p>Vamos usar o <code>while</code> para contar materiais coletados.</p><div class="note"><strong>while</strong> repete uma ação enquanto uma condição for verdadeira.</div><p>Faça uma etapa de cada vez. Se precisar, use as pistas.</p><p class="small">No exemplo, vamos contar até 3.</p>`)}
function renderQuiz(s){const r=state.records[s.id]||{hints:0,helps:0,solved:false};shell(s,`<p>${esc(s.q)}</p><div class="options">${s.opts.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><span>${esc(o)}</span></label>`).join("")}</div><div class="actions"><button id="check" class="primary">Conferir</button><button id="hint" class="secondary">Pista</button><button id="help" class="secondary">Não lembro</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div>`);const fb=(m,good=false)=>{const e=$("feedback");e.className="feedback"+(good?" good":"");e.textContent=m};$("check").onclick=()=>{const pick=document.querySelector('input[name="answer"]:checked');if(!pick){fb("Escolha uma resposta.");return}const ok=Number(pick.value)===s.correct;record(s,ok);fb(ok?s.ok:"Ainda não. Tente outra vez.",ok);if(ok)$("next").disabled=false};$("hint").onclick=()=>{r.hints=(r.hints||0)+1;state.records[s.id]=r;save();fb(s.hint)};$("help").onclick=()=>{r.helps=(r.helps||0)+1;state.records[s.id]=r;save();fb(s.help)};if(r.solved){fb(s.ok,true);$("next").disabled=false}}
function renderDemo(s){const n=state.demo;const shown=n>0?Array.from({length:Math.min(n,3)},(_,i)=>`Material ${i+1}`).join("\n"):"Clique para iniciar.";shell(s,`<p>O contador começa em 1 e vai até 3.</p><pre>while (contador <= 3) {\n    printf("Material %d", contador);\n    contador++;\n}</pre><div class="counter"><div class="counter-box"><span>contador</span><strong>${n===0?"—":Math.min(n,3)}</strong></div><button id="step" class="primary">${n<3?"Repetir uma vez":"Reiniciar exemplo"}</button></div><div class="output" aria-live="polite">${esc(shown)}</div><p class="small">Quando contador chega a 4, a condição fica falsa e o while para.</p>`);$("step").onclick=()=>{state.demo=n>=3?0:n+1;save();render()}}
function renderOrder(s){let r=state.records[s.id]||{hints:0,helps:0,solved:false};if(!Array.isArray(r.order)||r.order.length!==s.blocks.length)r.order=[2,0,4,1,3];const rows=r.order.map((v,i)=>`<div class="order-item"><div class="order-code">${esc(s.blocks[v])}</div><div><button data-up="${i}" ${i===0?"disabled":""} aria-label="Mover para cima">↑</button> <button data-down="${i}" ${i===r.order.length-1?"disabled":""} aria-label="Mover para baixo">↓</button></div></div>`).join("");shell(s,`<p>Use as setas para colocar as linhas na ordem.</p><div class="order-list">${rows}</div><div class="actions"><button id="check" class="primary">Conferir ordem</button><button id="hint">Pista</button><button id="help">Não lembro</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div>`);document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[r.order[i-1],r.order[i]]=[r.order[i],r.order[i-1]];state.records[s.id]=r;save();render()});document.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>{const i=+b.dataset.down;[r.order[i],r.order[i+1]]=[r.order[i+1],r.order[i]];state.records[s.id]=r;save();render()});const fb=(m,good=false)=>{$("feedback").className="feedback"+(good?" good":"");$("feedback").textContent=m};$("check").onclick=()=>{const ok=r.order.every((v,i)=>v===i);record(s,ok);if(ok){r.solved=true;state.records[s.id]=r;save()}fb(ok?"Ordem correta!":"Ainda não. Tente outra vez.",ok);if(ok)$("next").disabled=false};$("hint").onclick=()=>{r.hints=(r.hints||0)+1;state.records[s.id]=r;save();fb(s.hint)};$("help").onclick=()=>{r.helps=(r.helps||0)+1;state.records[s.id]=r;save();fb(s.help)};if(r.solved){fb("Ordem correta!",true);$("next").disabled=false}}
function renderMission(s){shell(s,`<p>O contador começa em 1. Queremos repetir <strong>4 vezes</strong>.</p><p>Qual condição devemos usar?</p><div class="options"><label class="option"><input type="radio" name="mission" value="0"><span>contador <= 4</span></label><label class="option"><input type="radio" name="mission" value="1"><span>contador < 4</span></label><label class="option"><input type="radio" name="mission" value="2"><span>contador == 4</span></label></div><div class="actions"><button id="check" class="primary">Conferir</button><button id="hint">Pista</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div>`);const r=state.records.mission||{hints:0,solved:false};const fb=(m,g=false)=>{$("feedback").className="feedback"+(g?" good":"");$("feedback").textContent=m};$("check").onclick=()=>{const pick=document.querySelector('input[name="mission"]:checked');if(!pick){fb("Escolha uma resposta.");return}const ok=Number(pick.value)===0;r.tries=(r.tries||0)+1;if(r.tries===1)r.first=ok?1:0;if(ok)r.solved=true;state.records.mission=r;save();fb(ok?"Missão concluída!":"Ainda não. Tente novamente.",ok);if(ok)$("next").disabled=false};$("hint").onclick=()=>{r.hints=(r.hints||0)+1;state.records.mission=r;save();fb("O contador começa em 1 e precisa chegar até 4.")};if(r.solved){fb("Missão concluída!",true);$("next").disabled=false}}
function render(){const s=screens[state.page]||screens[0];if(s.kind==="intro")renderIntro(s);else if(s.kind==="quiz")renderQuiz(s);else if(s.kind==="demo")renderDemo(s);else if(s.kind==="order")renderOrder(s);else renderMission(s)}
function report(){const sc=score();const rows=screens.filter(s=>s.id).map(s=>{const r=state.records[s.id]||{};return `${s.title}: primeira tentativa ${r.first??0}/1; tentativas ${r.tries||0}; pistas ${r.hints||0}; ajuda ${r.helps||0}; ${r.solved?"resolvida":"não resolvida"}`});return `${TITLE.toUpperCase()}\nProfessor: Cristhiano Vasconcellos\nEstudante: ${state.name||"Não informado"}\nData: ${new Date().toLocaleString("pt-BR")}\n\nPontos na primeira tentativa: ${sc.got}/${sc.total}\nTarefas resolvidas: ${sc.solved}/${sc.total}\nPistas: ${sc.hints} | “Não lembro”: ${sc.helps}\nPassos do exemplo: ${state.demo}\n\nDETALHAMENTO\n${rows.join("\n")}`}
async function summary(){const sc=score();$("main").innerHTML=`<section class="card"><div class="phase">Seu percurso</div><h1>Meu percurso</h1><p>Primeira tentativa: <strong>${sc.got}/${sc.total}</strong>.</p><p>Tarefas resolvidas: <strong>${sc.solved}/${sc.total}</strong>.</p><p>Pistas usadas: <strong>${sc.hints}</strong>. Ajuda usada: <strong>${sc.helps}</strong>.</p><label for="studentName"><strong>Seu nome:</strong></label><input id="studentName" style="width:100%;padding:11px;border:2px solid var(--line);border-radius:8px;margin:8px 0" maxlength="120" value="${esc(state.name)}"><div class="actions"><button class="primary" id="send">Enviar ao professor</button><button id="download">Baixar resumo</button><button id="return">Voltar</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><details><summary>Ver resultado por questão</summary><p>${sc.total? screens.filter(s=>s.id).map(s=>esc(s.title)+": "+(state.records[s.id]?.first??0)+"/1").join("<br>"):""}</p></details></section>`;$("studentName").oninput=e=>{state.name=e.target.value.trim();save()};$("return").onclick=render;$("download").onclick=()=>{state.name=$("studentName").value.trim();save();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([report()],{type:"text/plain;charset=utf-8"}));a.download="resumo_repetindo_coleta_while.txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("send").onclick=async()=>{if(busy)return;state.name=$("studentName").value.trim();save();const fb=$("feedback");if(!state.name){fb.textContent="Digite seu nome.";return}if(!/^https?:$/.test(location.protocol)){fb.textContent="Abra pelo link do site para enviar. Baixe o resumo se estiver usando o arquivo local.";return}busy=true;const btn=$("send");btn.disabled=true;btn.textContent="Enviando...";fb.textContent="Aguarde o envio.";try{const res=await fetch("https://formsubmit.co/ajax/"+DESTINO,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({_subject:"Programação I — while na coleta — "+state.name,_template:"table",_url:location.href,estudante:state.name,atividade:TITLE,resumo:report()})});let data;try{data=await res.json()}catch(_){data=null}if(!res.ok||!(data?.success===true||data?.success==="true"))throw new Error(data?.message||data?.error||"HTTP "+res.status);fb.className="feedback good";fb.textContent="Resumo recebido para encaminhamento ao professor.";btn.textContent="Resumo enviado"}catch(e){fb.textContent="Não foi possível confirmar o envio. FormSubmit informou: "+(e.message||"erro desconhecido")+". Baixe o resumo e tente novamente.";btn.disabled=false;btn.textContent="Tentar novamente"}finally{busy=false}}}
$("summaryTop").onclick=summary;$("restart").onclick=()=>$("restartDialog").showModal();$("cancelRestart").onclick=()=>$("restartDialog").close();$("confirmRestart").onclick=()=>{state=fresh();save();$("restartDialog").close();render()};$("backLink").onclick=e=>{if(busy)e.preventDefault()};render();
})();
</script>
</body>
</html>
