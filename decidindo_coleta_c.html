<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Decidindo na coleta — revisão e primeiro if em C</title>
<style>
:root{
  --bg:#f3f6f5;
  --paper:#fff;
  --ink:#20352f;
  --muted:#52665e;
  --green:#16634d;
  --soft:#eaf5ef;
  --line:#cbd9d2;
  --amber:#fff4db;
  --amberline:#ad7300;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:19px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
}
button,input,select{font:inherit}
button,.button{
  cursor:pointer;border:1px solid var(--line);border-radius:10px;
  padding:11px 19px;background:white;color:var(--ink);
  min-height:48px;
}
button:hover,.button:hover{
  border-color:var(--green);background:var(--soft);
}
button:disabled{cursor:default;opacity:.55}
button.primary{
  background:var(--green);color:white;border-color:var(--green);
}
:focus-visible{outline:3px solid #b06900;outline-offset:4px}
header,main,footer{max-width:900px;margin:auto;padding:22px}
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
}
.brand{font-size:16px;font-weight:750;letter-spacing:.03em}
.teacher{
  display:block;margin-top:3px;color:var(--muted);
  font-size:15px;font-weight:500;letter-spacing:0;
}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{font-size:15px;padding:8px 12px}
main{padding-top:4px}
.card{
  background:var(--paper);border:1px solid var(--line);
  border-radius:18px;padding:clamp(22px,5vw,42px);
  box-shadow:0 8px 30px #20352f08;
}
h1{
  font-size:clamp(27px,4vw,37px);line-height:1.2;
  margin:8px 0 22px;
}
h2{font-size:23px;line-height:1.3}
p{margin:14px 0}
.eyebrow,.small{font-size:15px;color:var(--muted)}
progress{
  width:100%;height:10px;accent-color:var(--green);
  margin:8px 0 19px;
}
pre{
  background:#182b25;color:#f4faf6;padding:20px;border-radius:12px;
  overflow:auto;line-height:1.65;font-size:18px;tab-size:4;
}
code{font-family:Consolas,"Liberation Mono",monospace}
p code,label code,li code{
  background:var(--soft);padding:2px 6px;border-radius:4px;
}
.visual{
  display:flex;align-items:center;justify-content:center;
  gap:14px;flex-wrap:wrap;margin:25px 0;
}
.box{
  border:2px solid var(--line);border-radius:12px;
  padding:14px 18px;text-align:center;min-width:125px;
}
.box strong{display:block;font-size:34px}
.box .tag{font:18px Consolas,monospace;color:var(--green)}
.box .small{display:block}
.symbol{font-size:30px;color:var(--green)}
.note{
  background:var(--soft);border-left:4px solid var(--green);
  padding:14px 18px;border-radius:5px;
}
.options{display:grid;gap:11px;margin:22px 0}
.option{
  display:flex;align-items:center;gap:13px;
  border:2px solid var(--line);border-radius:10px;
  padding:14px;cursor:pointer;margin-bottom:10px;
}
.option:has(input:checked){
  border-color:var(--green);background:var(--soft);
}
input[type=radio],input[type=checkbox]{
  width:22px;height:22px;accent-color:var(--green);flex-shrink:0;
}
input[type=number]{
  width:150px;padding:10px;border:2px solid var(--line);
  border-radius:8px;
}
input[type=text]{
  width:100%;padding:12px;border:2px solid var(--line);
  border-radius:8px;
}
select{
  max-width:100%;padding:10px;border:2px solid var(--line);
  border-radius:8px;background:white;color:var(--ink);
}
.match{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  align-items:center;gap:12px;margin:15px 0;
}
.match label{overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.feedback{
  margin-top:20px;padding:16px 18px;border-radius:10px;
  background:var(--amber);border-left:5px solid var(--amberline);
}
.feedback.good{background:var(--soft);border-color:var(--green)}
.feedback:empty{display:none}
nav{
  display:flex;justify-content:space-between;gap:14px;margin-top:26px;
}
nav button{min-width:125px}
.console{
  background:#182b25;color:#f4faf6;border-radius:12px;
  padding:20px;min-height:110px;white-space:pre-wrap;
  font-family:Consolas,monospace;
}
label.block{display:block;margin:18px 0 8px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{
  padding:12px 8px;text-align:left;border-bottom:1px solid var(--line);
  vertical-align:top;
}
.table-wrap{overflow:auto}
details{margin-top:20px}
summary{cursor:pointer;font-weight:600}
footer{font-size:14px;color:var(--muted);text-align:center}
footer a{color:var(--green)}
dialog{
  border:1px solid var(--line);border-radius:16px;
  max-width:480px;width:90%;padding:26px;color:var(--ink);
}
dialog::backdrop{background:#152a2477}
.print-only{display:none}
[hidden]{display:none!important}
@media(max-width:560px){
  body{font-size:18px}
  header,main{padding:14px}
  .match{grid-template-columns:1fr}
  .box{min-width:100px;padding:10px}
  .symbol{font-size:24px}
  pre{font-size:16px}
}
@media print{
  header,footer,nav,.actions,progress,.no-print{display:none!important}
  .print-only{display:block}
  body{background:white;font-size:12pt}
  main{max-width:none;padding:0}
  .card{border:0;box-shadow:none;padding:0}
  th,td{font-size:10pt}
  tr{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="brand">PROGRAMAÇÃO I · C
    <span class="teacher">Prof. Cristhiano Vasconcellos</span>
  </div>
  <div class="tools">
    <button id="summaryButton">Meu percurso</button>
    <button id="restartButton">Recomeçar</button>

</header>
<main id="main"></main>
<footer>

<dialog id="restartDialog">

  <div class="actions">
    <button id="cancelRestart">Manter meu progresso</button>
    <button class="primary" id="confirmRestart">Apagar e recomeçar</button>
  </div>
</dialog>
<noscript>Ative o JavaScript do navegador para usar a atividade.</noscript>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const KEY = "decidindo-coleta-c-v1";
const DESTINO = "cristhiano.vasconcellos@iffarroupilha.edu.br";
const TITULO = "Decidindo na coleta — revisão e primeiro if em C";
const esc = value => String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const code = value => "<pre><code>"+esc(value)+"</code></pre>";
const C = String.raw;
function box(name,value,caption="") { return `<div class="box"><span class="tag">${esc(name)}</span><strong>${esc(value)}</strong>${caption?`<span class="small">${esc(caption)}</span>`:""}</div>`; }
const program=C`#include <stdio.h>

int main() {
    int latinhas;

    printf("Quantas latinhas foram coletadas? ");
    scanf("%d", &latinhas);

    printf("Total coletado: %d\\n", latinhas);

    if (latinhas > 5) {
        printf("Boa coleta!\\n");
    }

    return 0;
}`;
const fresh=()=>({version:1,page:0,studentName:"",started:new Date().toISOString(),records:{},sim:{stage:0,value:""},tests:{four:false,eight:false}});
let state=fresh(),resumeAvailable=false,storageAvailable=true,sending=false;
try { const saved=JSON.parse(localStorage.getItem(KEY)); if(saved&&saved.version===1&&Number.isInteger(saved.page)&&saved.records&&typeof saved.records==="object"){state={...fresh(),...saved};state.sim={...fresh().sim,...saved.sim};state.tests={...fresh().tests,...saved.tests};state.studentName=typeof saved.studentName==="string"?saved.studentName:"";resumeAvailable=true;} } catch(_){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(_){storageAvailable=false;}}
function record(id){if(!state.records[id]||typeof state.records[id]!=="object")state.records[id]={};const r=state.records[id];r.attempts=Number.isInteger(r.attempts)?r.attempts:0;r.hints=Number.isInteger(r.hints)?r.hints:0;r.answers=Array.isArray(r.answers)?r.answers:[];r.history=Array.isArray(r.history)?r.history:[];r.solved=r.solved===true;return r;}
function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const screens=[
 {title:"Vamos revisar antes de avançar",kind:"read",body:()=>`<p>Você já trabalhou com <strong>variáveis</strong>, <code>printf</code>, <code>scanf</code> e uma <strong>soma</strong>.</p><p>Nesta atividade vamos relembrar essas ideias e aprender só uma coisa nova: fazer o programa tomar uma <strong>decisão simples</strong>.</p><p class="note">Não precisa ter pressa. Primeiro vamos revisar. Depois aparece o novo comando.</p>`},
 {id:"variable",group:"review",title:"Revisão: a variável",kind:"quiz",objective:"Reconhecer o valor guardado em uma variável",prompt:"A variável latinhas guarda o número 12. Qual é o valor guardado?",visual:`<div class="visual">${box("latinhas",12)}</div>`,options:["latinhas","12","int"],correct:[1],why:"12 é o valor guardado. latinhas é o nome da variável.",hint:"Olhe o número grande dentro da caixa da variável."},
 {id:"printf",group:"review",title:"Revisão: mostrar na tela",kind:"quiz",objective:"Reconhecer printf como saída",prompt:"Qual comando usamos para mostrar uma mensagem na tela?",options:["scanf","printf","int"],correct:[1],why:"printf mostra textos e valores na tela.",hint:"Na atividade anterior, esse comando começava com a letra p."},
 {id:"scanf",group:"review",title:"Revisão: receber pelo teclado",kind:"quiz",objective:"Reconhecer scanf como entrada",prompt:"Qual comando recebe um número digitado pelo teclado?",options:["printf","scanf","return"],correct:[1],why:"scanf lê o número digitado e pode guardá-lo em uma variável.",hint:"O comando de entrada começa com scan."},
 {id:"inputvalue",group:"review",title:"Revisão: o número digitado",kind:"quiz",objective:"Identificar o valor recebido por scanf",prompt:"A pessoa digitou 9. Qual valor fica em latinhas?",snippet:'scanf("%d", &latinhas);',options:["5","9","%d"],correct:[1],why:"Como a pessoa digitou 9, scanf guarda 9 em latinhas.",hint:"Use exatamente o número que a pessoa digitou."},
 {id:"assignment",group:"review",title:"Revisão: guardar um valor",kind:"quiz",objective:"Interpretar uma atribuição",prompt:"Depois desta linha, qual valor está guardado em total?",snippet:"total = 7;",options:["0","7","total"],correct:[1],why:"O sinal = guarda o valor da direita na variável da esquerda.",hint:"Leia assim: total recebe 7."},
 {id:"sum",group:"review",title:"Revisão: uma soma simples",kind:"quiz",objective:"Calcular e guardar uma soma",prompt:"Qual valor será guardado em total?",snippet:"total = 4 + 3;",options:["43","7","4"],correct:[1],why:"4 + 3 é 7. O resultado fica guardado em total.",hint:"Junte quatro latinhas com mais três latinhas."},
 {id:"output",group:"review",title:"Revisão: mostrar o valor",kind:"quiz",objective:"Interpretar %d na saída",prompt:"latinhas guarda 8. O que aparece na tela?",snippet:'printf("Latinhas: %d", latinhas);',options:["Latinhas: %d","Latinhas: latinhas","Latinhas: 8"],correct:[2],why:"O %d é substituído pelo valor guardado em latinhas.",hint:"Troque mentalmente %d pelo número 8."},
 {title:"Agora uma ideia nova: decidir",kind:"read",body:()=>`<p>Imagine esta regra:</p><div class="visual">${box("latinhas",8)}<span class="symbol" aria-hidden="true">→</span>${box("mensagem","Boa coleta!")}</div><p><strong>Se</strong> a quantidade for maior que 5, mostramos a mensagem <strong>Boa coleta!</strong>.</p><p class="note">Primeiro vamos entender a regra em português. Depois veremos como escrever isso em C.</p>`},
 {id:"logic",group:"new",title:"Entenda a decisão",kind:"quiz",objective:"Compreender uma condição simples",prompt:"Foram coletadas 8 latinhas. A regra diz: se a quantidade for maior que 5, mostrar Boa coleta! A mensagem aparece?",options:["Sim","Não","Só se for exatamente 5"],correct:[0],why:"8 é maior que 5. Por isso a condição é atendida e a mensagem aparece.",hint:"Compare os números: 8 é maior que 5?"},
 {title:"Em C, usamos if",kind:"read",body:()=>`${code(C`if (latinhas > 5) {
    printf("Boa coleta!");
}`)}<p>Leia assim: <strong>se latinhas for maior que 5, mostre Boa coleta!</strong></p><p><code>if</code> significa uma decisão. O sinal <code>&gt;</code> significa <strong>maior que</strong>.</p><p class="note">Se a condição não for verdadeira, o comando dentro das chaves não é executado.</p>`},
 {id:"iftrue",group:"new",title:"Quando o if executa",kind:"quiz",objective:"Interpretar um if verdadeiro",prompt:"latinhas guarda 10. O que acontece?",snippet:C`if (latinhas > 5) {
    printf("Boa coleta!");
}`,options:["Aparece Boa coleta!","Não aparece nada","O programa muda latinhas para 5"],correct:[0],why:"10 é maior que 5, então o printf dentro do if é executado.",hint:"Pergunte: 10 é maior que 5?"},
 {id:"iffalse",group:"new",title:"E quando a condição não é atendida?",kind:"quiz",objective:"Interpretar um if falso",prompt:"latinhas guarda 4. O que acontece com a mensagem Boa coleta!?",snippet:C`if (latinhas > 5) {
    printf("Boa coleta!");
}`,options:["A mensagem aparece","A mensagem não aparece","latinhas passa a valer 5"],correct:[1],why:"4 não é maior que 5. Então o printf dentro do if não é executado.",hint:"Compare: 4 é maior que 5?"},
 {title:"Acompanhe uma coleta",kind:"sim",body:()=>`<p>Digite uma quantidade e acompanhe o programa uma etapa por vez.</p><p class="small">Simulação guiada; não é um compilador.</p><div id="simCode"></div><div class="visual"><div class="box"><span class="tag">latinhas</span><strong id="memory">—</strong></div></div><div class="console" id="console" aria-live="polite"></div><div id="inputArea" hidden><label class="block" for="quantity">Digite a quantidade de latinhas (0 a 99):</label><input id="quantity" type="number" min="0" max="99" step="1" inputmode="numeric"></div><p id="simExplanation" class="note" aria-live="polite"></p><div class="actions"><button id="simNext" class="primary">Executar próximo comando</button><button id="simReset">Testar outra quantidade</button></div>`},
 {title:"Agora execute em C",kind:"practice",body:()=>`<p>Use este modelo no <strong>Dev-C++</strong> ou em um <strong>compilador online de C</strong>.</p>${code(program)}<div class="actions"><button id="downloadC" class="primary">Baixar programa .c</button></div><p>Execute pelo menos duas vezes:</p><label class="option"><input id="testFour" type="checkbox" ${state.tests.four?"checked":""}><span>Testei com <strong>4</strong>: apareceu o total, mas <strong>não</strong> apareceu “Boa coleta!”.</span></label><label class="option"><input id="testEight" type="checkbox" ${state.tests.eight?"checked":""}><span>Testei com <strong>8</strong>: apareceu o total e também <strong>“Boa coleta!”</strong>.</span></label><p class="small">Marque somente depois de executar. Esta página não verifica o compilador.</p><details><summary>Preciso de ajuda</summary><p>Salve o arquivo com extensão <code>.c</code>, compile e execute. Digite um número e pressione Enter.</p><p>Se houver erro, compare os pontos e vírgulas, as chaves, o <code>&amp;</code> do scanf e o sinal <code>&gt;</code>.</p></details>`}
];
const questions=screens.filter(s=>s.id);questions.forEach(s=>{if(state.records[s.id])record(s.id);});
function situation(r){if(!r||!r.attempts)return r?.answers?.some(a=>a!==null&&a!==undefined)?"Selecionou; falta conferir":"Ainda não respondeu";if(!r.solved)return"Respondeu; precisa retomar";const hints=r.success?.hints??r.hints??0,attempt=r.success?.attempt??r.attempts;if(hints>0)return"Resolveu com pista";if(attempt>1)return"Resolveu após retorno explicativo";return"Resolveu na primeira tentativa, sem pista";}
function firstCorrect(s){return state.records[s.id]?.history?.[0]?.correct===true;}
function stats(group=null){const qs=group?questions.filter(s=>s.group===group):questions;const answered=qs.filter(s=>(state.records[s.id]?.attempts||0)>0).length;const solved=qs.filter(s=>state.records[s.id]?.solved===true).length;const first=qs.filter(firstCorrect).length;const hints=qs.reduce((n,s)=>n+(state.records[s.id]?.hints||0),0);return{total:qs.length,answered,solved,first,hints,percent:qs.length?Math.round(first*100/qs.length):0};}
function register(r,answers,expected){if(answers.length!==expected.length||answers.some(a=>a===null||a===undefined))return null;if(r.solved)return true;r.answers=[...answers];r.attempts++;const correct=answers.every((a,i)=>a===expected[i]);r.history.push({answers:[...answers],correct,hints:r.hints,time:new Date().toISOString()});if(correct){r.solved=true;r.success={attempt:r.attempts,hints:r.hints};}return correct;}
function frame(title,contents,progress=true){$("main").innerHTML=`${progress?`<div class="eyebrow">Etapa ${state.page+1} de ${screens.length}</div><progress aria-label="Posição na atividade" max="${screens.length}" value="${state.page+1}"></progress>`:""}<section class="card"><h1 id="heading" tabindex="-1">${title}</h1>${contents}</section>`;$("storageNote").textContent=storageAvailable?"Seu progresso fica neste navegador. Você pode continuar depois.":"O navegador não permitiu salvar. Baixe seu resumo antes de fechar.";$("heading").focus({preventScroll:true});window.scrollTo(0,0);}
function feedback(text,good=false){$("feedback").className="feedback"+(good?" good":"");$("feedback").textContent=text;}
function fields(s,r){return `${s.visual||""}${s.snippet?code(s.snippet):""}<div class="options" role="radiogroup" aria-label="${esc(s.prompt)}">${s.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${r.answers[0]===i?"checked":""} ${r.solved?"disabled":""}><span>${esc(o)}</span></label>`).join("")}</div>`;}
function capture(){const selected=document.querySelector('input[name="answer"]:checked');return[selected?Number(selected.value):null];}
function render(){state.page=Math.max(0,Math.min(state.page,screens.length-1));const s=screens[state.page],r=s.id?record(s.id):null;const content=s.body?s.body():`<p>${esc(s.prompt)}</p>${fields(s,r)}<div class="actions"><button id="check" class="primary" ${r.solved?"disabled":""}>Conferir resposta</button><button id="hint" ${r.solved?"disabled":""}>Quero uma pista</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div>`;frame(s.title,content+`<nav aria-label="Navegação da atividade"><button id="back" ${state.page===0?"disabled":""}>Voltar</button><button id="next" class="primary">${state.page===screens.length-1?"Ver meu resumo":"Continuar"}</button></nav>${s.id?`<p class="small">Você pode continuar mesmo sem acertar e voltar depois.</p>`:""}`);$("back").onclick=()=>{state.page--;save();render();};$("next").onclick=()=>{if(state.page===screens.length-1){save();showSummary();return;}state.page++;save();render();};if(s.id){document.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener("change",()=>{r.answers=capture();save();}));$("check").onclick=()=>{const answers=capture(),result=register(r,answers,s.correct);if(result===null){feedback("Escolha uma opção antes de conferir.");return;}save();if(result){render();return;}feedback(s.why+" Você pode mudar a resposta e tentar novamente.");};$("hint").onclick=()=>{r.hints++;save();feedback(s.hint);};if(r.solved)feedback("Correto. "+s.why,true);else if(r.attempts)feedback(s.why+" Você pode tentar novamente.");}if(s.kind==="sim")setupSimulation();if(s.kind==="practice"){ $("downloadC").onclick=()=>download("decidindo_coleta.c",program);$("testFour").onchange=e=>{state.tests.four=e.target.checked;save();};$("testEight").onchange=e=>{state.tests.eight=e.target.checked;save();};}}
function setupSimulation(){const n=Math.max(0,Math.min(Number(state.sim.stage)||0,5));state.sim.stage=n;const v=state.sim.value,good=Number(v)>5;const stages=[{line:"int latinhas;",text:"Primeiro declaramos a variável.",output:"O programa ainda não mostrou uma mensagem."},{line:'printf("Quantas latinhas foram coletadas? ");',text:"Agora o programa vai pedir a quantidade.",output:""},{line:'scanf("%d", &latinhas);',text:"Digite a quantidade e clique em Guardar número.",output:"Quantas latinhas foram coletadas? "},{line:'printf("Total coletado: %d\\n", latinhas);',text:"scanf guardou "+v+" em latinhas. Agora vamos mostrar esse valor.",output:"Quantas latinhas foram coletadas? "+v},{line:"if (latinhas > 5) { ... }",text:"Agora o programa pergunta: "+v+" é maior que 5? "+(good?"Sim.":"Não."),output:"Quantas latinhas foram coletadas? "+v+"\\nTotal coletado: "+v},{line:'printf("Boa coleta!");',text:good?"A condição foi verdadeira. A mensagem foi mostrada.":"A condição foi falsa. O printf dentro do if foi pulado.",output:"Quantas latinhas foram coletadas? "+v+"\\nTotal coletado: "+v+(good?"\\nBoa coleta!":"")}];$("simCode").innerHTML=code(stages[n].line);const mem=$("memory");if(mem)mem.textContent=n>=3?v:"—";$("console").textContent=stages[n].output.replaceAll("\\n","\n");$("simExplanation").textContent=stages[n].text;$("inputArea").hidden=n!==2;$("quantity").value=v;$("simNext").disabled=n===5;$("simNext").textContent=n===2?"Guardar número":n===5?"Simulação concluída":"Executar próximo comando";$("simNext").onclick=()=>{if(n===2){const value=$("quantity").value.trim();if(!/^\d{1,2}$/.test(value)){$("simExplanation").textContent="Digite um número inteiro de 0 a 99.";$("quantity").focus();return;}state.sim.value=String(Number(value));}state.sim.stage=n+1;save();setupSimulation();};$("quantity").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("simNext").click();}};$("simReset").onclick=()=>{state.sim={stage:0,value:""};save();setupSimulation();};}
function answerLabel(s,value){if(value===null||value===undefined)return"Sem seleção";return s.options?.[value]??"Sem seleção";}
function summaryText(){const t=stats(),rev=stats("review"),nov=stats("new");const lines=[TITULO.toUpperCase(),"Professor: Cristhiano Vasconcellos","Estudante: "+(state.studentName||"Não informado"),"Gerado em: "+new Date().toLocaleString("pt-BR"),"","PONTUAÇÃO (primeira tentativa): "+t.first+"/"+t.total+" — "+t.percent+"%","Revisão: "+rev.first+"/"+rev.total+" — "+rev.percent+"%","Conteúdo novo (if): "+nov.first+"/"+nov.total+" — "+nov.percent+"%","Atividades resolvidas ao final: "+t.solved+"/"+t.total,"Consultas a pistas: "+t.hints,"","A pontuação considera somente a primeira tentativa. O estudante pode continuar tentando depois.",""];questions.forEach((s,index)=>{const r=state.records[s.id];lines.push("QUESTÃO "+(index+1)+" — "+(s.group==="review"?"REVISÃO":"CONTEÚDO NOVO"),s.objective,"Enunciado: "+s.prompt);if(s.snippet)lines.push("Código:\n"+s.snippet);lines.push("Situação: "+situation(r),"Tentativas: "+(r?.attempts||0),"Consultas a pistas: "+(r?.hints||0));(r?.history||[]).forEach((h,i)=>lines.push("Tentativa "+(i+1)+": "+answerLabel(s,h.answers[0]),"Resultado: "+(h.correct?"correto":"incorreto"),"Pistas consultadas até então: "+(h.hints||0)));lines.push("");});lines.push("Simulação: "+(state.sim.stage===5?"concluída":"não concluída"),"Teste com 4: "+(state.tests.four?"declarado pelo estudante":"não marcado"),"Teste com 8: "+(state.tests.eight?"declarado pelo estudante":"não marcado"),"","Os testes no compilador são autodeclarados.","O resultado deve ser interpretado junto com tentativas, pistas e acompanhamento do professor.");return lines.join("\n");}
function showSummary(){if(sending)return;const t=stats(),rev=stats("review"),nov=stats("new");frame("Seu percurso",`<p>Sua pontuação na <strong>primeira tentativa</strong> foi <strong>${t.first} de ${t.total} (${t.percent}%)</strong>.</p><div class="table-wrap"><table><thead><tr><th>Parte</th><th>Primeira tentativa</th><th>Percentual</th></tr></thead><tbody><tr><td>Revisão</td><td>${rev.first}/${rev.total}</td><td>${rev.percent}%</td></tr><tr><td>Conteúdo novo: if</td><td>${nov.first}/${nov.total}</td><td>${nov.percent}%</td></tr></tbody></table></div><p>Ao final, você resolveu <strong>${t.solved} de ${t.total}</strong> atividades. Consultou pistas <strong>${t.hints}</strong> vez(es).</p><p class="small">Errar faz parte. A pontuação acima registra a primeira tentativa para ajudar o professor a acompanhar sua aprendizagem.</p><form id="formResumo" class="no-print"><label class="block" for="studentName">Seu nome:</label><input id="studentName" type="text" required maxlength="120" autocomplete="name" value="${esc(state.studentName||"")}"><p class="small">Ao enviar, seu nome, pontuação, respostas, tentativas e consultas a pistas serão encaminhados ao professor pelo FormSubmit.</p><div class="actions"><button id="sendReport" type="submit" class="primary">Enviar resumo ao professor</button></div><p id="sendMessage" class="feedback" role="status" aria-live="polite"></p></form><div class="actions"><button id="return">Voltar à atividade</button><button id="downloadReport">Baixar resumo</button><button id="printReport">Imprimir resumo</button></div><details class="no-print"><summary>Retomar uma etapa</summary><label class="block" for="jump">Escolha a etapa:</label><select id="jump">${screens.map((s,i)=>`<option value="${i}" ${state.page===i?"selected":""}>${i+1}. ${esc(s.title)}</option>`).join("")}</select><button id="go">Abrir etapa</button></details>`,false);const name=$("studentName");function saveName(){state.studentName=name.value.trim();save();}name.oninput=saveName;$("return").onclick=render;$("downloadReport").onclick=()=>{saveName();download("resumo_decidindo_coleta_c.txt",summaryText());};$("printReport").onclick=()=>{saveName();window.print();};$("go").onclick=()=>{state.page=Number($("jump").value);save();render();};$("formResumo").onsubmit=async event=>{event.preventDefault();if(sending)return;saveName();const message=$("sendMessage"),button=$("sendReport");if(!state.studentName){message.textContent="Digite seu nome antes de enviar.";name.focus();return;}if(!/^https?:$/.test(location.protocol)){message.textContent="Abra a atividade pelo link do site para enviar. Se estiver usando o arquivo no computador, baixe o resumo.";return;}const student=state.studentName,report=summaryText(),controls=Array.from(document.querySelectorAll("button,input,select")).map(el=>[el,el.disabled]);controls.forEach(([el])=>el.disabled=true);sending=true;button.textContent="Enviando...";message.className="feedback";message.textContent="Aguarde enquanto o resumo é enviado.";const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),25000);let accepted=false;try{const response=await fetch("https://formsubmit.co/ajax/"+DESTINO,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},signal:controller.signal,body:JSON.stringify({_subject:"Programação I — Decidindo na coleta — "+student,_template:"table",_url:location.href.split("#")[0],estudante:student,atividade:TITULO,resumo:report})});let data=null;try{data=await response.json();}catch(_){data=null;}if(!response.ok){const detail=data?.message||data?.error||("HTTP "+response.status);throw new Error(detail);}if(data?.success!==true&&data?.success!=="true"){throw new Error(data?.message||data?.error||"Envio não confirmado pelo FormSubmit");}accepted=true;message.className="feedback good";message.textContent="O serviço recebeu seu resumo para encaminhar ao professor. Você também pode baixar uma cópia.";}catch(error){message.className="feedback";const detail=error?.name==="AbortError"?"Tempo de espera excedido.":(error?.message||"Erro desconhecido.");message.textContent="Não foi possível confirmar o envio. FormSubmit informou: "+detail+" Baixe o resumo para não perdê-lo e tente novamente.";}finally{clearTimeout(timeout);sending=false;controls.forEach(([el,disabled])=>el.disabled=disabled);button.disabled=accepted;button.textContent=accepted?"Resumo encaminhado":"Tentar enviar novamente";}};}
function start(){if(resumeAvailable){frame("Vamos continuar?",`<p>Há um percurso salvo desta atividade neste navegador.</p><p>Você estava na etapa <strong>${Math.max(1,Math.min(state.page+1,screens.length))} de ${screens.length}</strong>.</p><div class="actions"><button id="resume" class="primary">Continuar meu percurso</button><button id="newAttempt">Começar novamente</button></div>`,false);$("resume").onclick=render;$("newAttempt").onclick=()=>$("restartDialog").showModal();}else render();}
$("summaryButton").onclick=showSummary;$("restartButton").onclick=()=>{if(!sending)$("restartDialog").showModal();};$("cancelRestart").onclick=()=>$("restartDialog").close();$("confirmRestart").onclick=()=>{if(sending)return;state=fresh();resumeAvailable=false;save();$("restartDialog").close();render();};$("indexLink").onclick=e=>{if(sending)e.preventDefault();};start();
})();
