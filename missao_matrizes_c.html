<style>

disabled){background:#166534;color:white}.progressbox{margin:20px 0}.progresslabels{display:flex;justify-content:space-between;font-size:.83rem;margin-bottom:8px}.bar{height:7px;border-radius:9px;background:#e1e9e5;overflow:hidden}.bar div{height:100%;background:var(--bright);transition:width .2s}.card{background:#fff;border:1px solid var(--border);border-radius:26px;box-shadow:0 14px 44px #15382708;padding:30px}.track{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #edf0f2;padding-bottom:20px;margin-bottom:24px}.dot{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:#f8fafc;font-weight:700;color:var(--muted)}.dot.active{outline:2px solid var(--blue);outline-offset:2px}.dot.ok{background:#dcfce7;color:#166534;border-color:#86c99b}.dot.tried{background:#fff4dc;color:#92400e}.prompt{max-width:780px;color:var(--muted);margin-bottom:24px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}.workspace.single{display:block}.panel{background:#f8fafc;border:1px solid #e3e9ee;border-radius:18px;padding:20px;min-width:0}.panel> :first-child{margin-top:0}.matrix{border-collapse:separate;border-spacing:7px;margin:6px auto;table-layout:fixed;width:100%;max-width:350px;text-align:center}.matrix th{font-size:.76rem;color:var(--muted);font-weight:600}.matrix th:first-child{width:57px}.matrix td{height:58px;padding:0}.cell{display:grid;place-items:center;width:100%;min-height:58px;background:white;border:1px solid #cbd9df;border-radius:12px;font-size:1.1rem;font-weight:750;color:var(--ink)}button.cell:hover:not(:disabled){background:#e8f7ee;border-color:var(--green)}.cell.selected{background:#dcfce7;border:2px solid var(--green)}.cell.visited{background:#e0f2fe;border:2px solid #0284c7}.cell.current{background:#fef3c7;border:2px solid #d97706}.indexlit{color:var(--blue)!important;font-weight:800!important}.legend{font-size:.8rem;color:var(--muted);text-align:center;margin-top:12px}pre,.code{font-family:"Cascadia Code",Consolas,monospace;font-size:.88rem;line-height:1.85;background:#f1f5f9;border-radius:14px;padding:16px;overflow-x:auto;tab-size:2;white-space:pre}code{font-family:Consolas,monospace;color:#075985}pre code{color:var(--ink)}.code select{font-family:inherit;font-size:.88rem;max-width:160px;padding:4px}.choices{display:grid;gap:10px}.choice{padding:14px;text-align:left;background:#fff;border:1px solid var(--border);border-radius:13px}.choice.selected{background:#edf9f1;border:2px solid var(--green)}input[type=text],input[type=number],select{border:1px solid #b7c7d0;border-radius:9px;background:white;padding:10px;min-height:42px;color:var(--ink);max-width:100%}input[type=number]{width:100px}label.field{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match button{min-height:48px}.feedback{padding:15px 18px;margin:20px 0;border-radius:13px;background:#f1f5f9}.feedback.good{background:#edf9f1;border:1px solid #b5dec2}.feedback.bad{background:#fff6e5;border:1px solid #ecd3a3}.feedback:empty{display:none}.hint{margin-top:23px;background:#f8fafc;border-radius:12px;padding:12px 16px;font-size:.9rem}.hint summary{cursor:pointer;font-weight:600}.hint p{margin-bottom:0;color:var(--muted)}.nav{border-top:1px solid #edf0f2;margin-top:22px;padding-top:22px}.status{min-height:26px;font-size:.86rem;color:var(--blue);margin-top:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{border-radius:17px;background:#f2f8f5;text-align:center;padding:18px}.stat strong{display:block;font-size:2rem;color:var(--green)}.stat span{font-size:.82rem}.resultlist{padding:0;list-style:none}.resultlist li{border-bottom:1px solid var(--border);padding:10px 0;display:flex;justify-content:space-between;gap:16px;font-size:.88rem}.focus header.hero,.focus .byline{display:none}.focus .progressbox{margin-top:18px}.hidden{display:none!important}.warmup{max-width:480px;margin:22px auto}.selectedline{background:#dff2ff;display:block;border-radius:5px}.linebtn{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:7px;background:transparent;font-family:Consolas,monospace;font-size:.87rem;white-space:pre;padding:4px}.linebtn.selected{background:#fff0d1;border-color:#dba642}.corrections{margin-top:14px}.storagewarn{color:var(--warn);font-size:.8rem}.sendbox{border:1px solid var(--border);background:#f8fafc;border-radius:16px;padding:18px;margin:20px 0}.sendbox p{margin:6px 0}.note{border-left:3px solid #38bdf8;padding-left:14px;color:var(--muted)}@media(max-width:720px){main{padding:18px 12px 40px}.card{padding:19px 15px;border-radius:20px}.workspace{grid-template-columns:1fr}.panel{padding:14px}.stats{gap:7px}.stat{padding:12px 5px}.stat strong{font-size:1.6rem}.nav .btn{flex:1;text-align:center}.code,pre{font-size:.8rem;padding:10px}.code select{font-size:.8rem;max-width:130px}.byline{margin-top:24px}.matrix td,.cell{min-height:48px;height:48px}.dot{width:34px;height:34px}.top{gap:8px}.top .btn{padding:7px 10px;font-size:.8rem}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main><div class="top"><a href="objetos.html">← Voltar aos objetos</a><div class="actions"><button class="btn" id="focus">Modo foco</button><button class="btn" id="restart">Recomeçar</button><span class="chip" id="score">★ 0 / 100</span></div></div><header class="hero"><p class="byline">Programação I · C · Prof. Cristhiano Vasconcellos</p><h1>Missão Matrizes:<br>Central dos Tabuleiros</h1><p class="subtitle">Encontre posições, acompanhe os laços e coloque as matrizes para funcionar em C. Aqui, todo índice começa em zero.</p></header><div id="progress"></div><section class="card" id="app"></section><p class="small" id="saveNote">Seu progresso fica salvo neste navegador.</p></main>
<script>
'use strict';
const URL_WEBAPP='https://script.google.com/macros/s/AKfycbzoeygTm-R27yb8QOcdH0s7fViv6vGPQ5MtDuCgHBt3RhvFVQKlGxf3A7yQUR3RfRqFcw/exec';
const TITLE='Missão Matrizes em C: Central dos Tabuleiros';
const KEY='programacao1_missao_matrizes_c_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const phases=[
{title:'Encontre a posição',level:'Primeiros passos',prompt:'O robô recebeu o endereço mapa[2][0]. Clique na posição correspondente e confira sua escolha.',hint:'O primeiro par de colchetes escolhe a linha; o segundo, a coluna. A linha 2 é a terceira linha.',type:'target',matrix:[[3,8,1],[6,2,9],[4,7,5]],answer:[6],explain:'mapa[2][0] é a terceira linha e a primeira coluna. A posição guarda 4; o índice e o conteúdo são informações diferentes.'},
{title:'Cada índice, seu conteúdo',level:'Primeiros passos',prompt:'Associe cada acesso ao valor guardado na matriz. Clique no acesso e depois no valor correspondente.',hint:'Encontre a linha antes da coluna. Não use o índice como se fosse o valor guardado.',type:'match',matrix:[[6,1,8],[4,9,2]],answer:[8,4,9],explain:'mapa[0][2] guarda 8; mapa[1][0] guarda 4; mapa[1][1] guarda 9.'},
{title:'Declare a matriz',level:'Primeiros passos',prompt:'O mapa terá 3 linhas e 4 colunas, com números inteiros. Complete a declaração em C.',hint:'Em C, a declaração informa a quantidade de linhas e de colunas, não o último índice.',type:'blanks',answer:['3','4'],code:'int mapa[{0}][{1}];',options:[['2','3','4'],['3','4','5']],explain:'A declaração é int mapa[3][4];. Os índices válidos são 0, 1 e 2 para as linhas e 0, 1, 2 e 3 para as colunas: 12 posições.'},
{title:'Uma jogada por vez',level:'Primeiros passos',prompt:'No tabuleiro, 0 = posição vazia e 1 = marca X. Qual posição muda depois deste comando?',hint:'A atribuição troca o conteúdo de uma única posição: a que aparece à esquerda do sinal =.',type:'choice',matrix:[[0,1,0],[0,0,0],[1,0,0]],code:'tabuleiro[1][2] = 1;',choices:['[2][1] passa a guardar 1.','[1][2] passa a guardar 1.','Todas as posições da linha 1 guardam 1.'],answer:[1],explain:'Somente [1][2], segunda linha e terceira coluna, recebe 1. Confira a posição destacada no tabuleiro.'},
{title:'O caminho do robô',level:'Explorando os laços',prompt:'O robô já visitou [0][0]. Clique, na ordem, nas três próximas posições que os laços vão visitar.',hint:'O laço interno percorre as colunas 0, 1 e 2. Só depois a linha muda, e a coluna volta a 0.',type:'path',matrix:[[0,0,0],[0,0,0]],code:'for (linha = 0; linha < 2; linha++) {\n    for (coluna = 0; coluna < 3; coluna++) {\n        printf("%d ", mapa[linha][coluna]);\n    }\n}',answer:[1,2,3],explain:'Depois de [0][0], vêm [0][1], [0][2] e [1][0]. O laço de colunas recomeça em 0 na nova linha.'},
{title:'Complete a leitura',level:'Explorando os laços',prompt:'Complete o trecho para ler todas as posições de int mapa[3][2]. As variáveis linha e coluna são inteiras.',hint:'São três linhas e duas colunas. No scanf, use & antes do elemento da matriz e mantenha linha antes de coluna.',type:'blanks',answer:['3','2','linha][coluna'],code:'for (linha = 0; linha < {0}; linha++) {\n    for (coluna = 0; coluna < {1}; coluna++) {\n        scanf("%d", &mapa[{2}]);\n    }\n}',options:[['2','3','4'],['1','2','3'],['linha][coluna','coluna][linha','0][0']],explain:'O laço externo percorre as linhas 0, 1 e 2; o interno, as colunas 0 e 1. scanf("%d", &mapa[linha][coluna]) guarda cada entrada em uma posição diferente.'},
{title:'Radar de tesouros',level:'Usando os dados',prompt:'Neste mapa, 0 = vazio, 1 = pedra e 2 = tesouro. Complete a condição em C para contar apenas os tesouros e informe quantos existem.',hint:'Em C, a comparação de igualdade usa ==. O contador aumenta quando o conteúdo é 2.',type:'count',matrix:[[2,0,1],[1,2,2],[0,1,0]],answer:['2','3'],explain:'Há três posições com código 2: [0][0], [1][1] e [1][2]. O contador aumenta três vezes e termina em 3.'},
{title:'Energia da equipe',level:'Usando os dados',prompt:'Cada linha é um jogador; cada coluna, uma rodada. Preveja o total de energia da coluna 1. Depois de conferir, explore a execução passo a passo.',hint:'O segundo índice fica em 1. Some apenas energia[0][1], energia[1][1] e energia[2][1].',type:'sum',matrix:[[8,4,2],[1,3,7],[6,5,9]],answer:['12'],code:'soma = 0;\nfor (linha = 0; linha < 3; linha++) {\n    soma = soma + energia[linha][1];\n}\nprintf("%d\\n", soma);',explain:'A coluna de índice 1 é a segunda coluna: 4 + 3 + 5 = 12. A linha muda; a coluna fica fixa.'},
{title:'Conserte o percurso',level:'Desafio 1',prompt:'O objetivo é ler as seis posições. Há exatamente dois erros neste programa em C. Selecione as duas linhas com erro e escolha as correções.',hint:'Compare cada laço com as dimensões declaradas. No scanf, o primeiro índice deve acompanhar a linha.',type:'debug',answer:[5,7,'2','linha][coluna'],lines:['#include <stdio.h>','int main(void) {','    int mapa[2][3];','    int linha, coluna;','','    for (linha = 0; linha < 3; linha++) {','        for (coluna = 0; coluna < 3; coluna++) {','            scanf("%d", &mapa[coluna][linha]);','        }','    }','    return 0;','}'],explain:'A linha 6 do código deve usar linha < 2, pois a matriz tem duas linhas. A linha 8 deve usar &mapa[linha][coluna]. Os números à esquerda identificam linhas de código, não índices da matriz.'},
{title:'Abastecer as bases',level:'Desafio final',prompt:'Cada linha representa uma base. Complete o trecho em C que soma os suprimentos de cada base separadamente e informe os três totais. A matriz suprimentos já está preenchida; linha, coluna e soma são inteiros.',hint:'Zere soma no começo de cada linha. Acrescente o conteúdo da posição e mostre o total depois de terminar as colunas.',type:'final',matrix:[[2,3,4],[1,5,2],[6,2,4]],answer:['0','suprimentos[linha][coluna]','9','8','12'],code:'for (linha = 0; linha < 3; linha++) {\n    soma = {0};\n    for (coluna = 0; coluna < 3; coluna++) {\n        soma = soma + {1};\n    }\n    printf("Base %d: %d\\n", linha, soma);\n}',options:[['0','1','soma'],['1','suprimentos[linha][coluna]','linha']],explain:'A soma recomeça em 0 para cada base. Base 0: 2 + 3 + 4 = 9; base 1: 1 + 5 + 2 = 8; base 2: 6 + 2 + 4 = 12.'}
];
function fresh(){return {version:1,id:Date.now()+'-'+Math.random().toString(36).slice(2),name:'',started:false,current:0,focus:false,finished:false,summary:false,send:'idle',items:phases.map(()=>({tries:0,correct:false,first:false,hint:false,draft:[],message:''}))}}
let storageOK=true;
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&s.version===1&&s.items?.length===10&&s.items.every(x=>Array.isArray(x.draft)&&Number.isInteger(x.tries))&&Number.isInteger(s.current)&&s.current>=0&&s.current<10){if(s.send==='sending')s.send='uncertain';return s}}catch(e){storageOK=false}return fresh()}
let state=load(),pair=null,simStep=0,busy=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false} $('saveNote').textContent=storageOK?'Seu progresso fica salvo neste navegador.':'O navegador não permitiu salvar o progresso. Mantenha esta aba aberta e baixe o resumo ao terminar.';$('saveNote').classList.toggle('storagewarn',!storageOK)}
function points(){return state.items.filter(x=>x.correct).length*10}
function header(){document.body.classList.toggle('focus',state.focus);$('focus').textContent=state.focus?'Modo completo':'Modo foco';$('focus').setAttribute('aria-pressed',String(state.focus));$('score').textContent='★ '+points()+' / 100';let n=state.items.filter(x=>x.tries>0).length;$('progress').innerHTML=state.started?`<div class="progressbox"><div class="progresslabels"><span>${n} de 10 atividades respondidas</span><span>Índices a partir de 0</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${n}" aria-label="Atividades respondidas"><div style="width:${n*10}%"></div></div></div>`:''}
function matrix(data,mode='',picked=[]){return `<table class="matrix" aria-label="Matriz com índices começando em zero"><thead><tr><th>Índices</th>${data[0].map((_,c)=>`<th id="col${c}">Col. ${c}</th>`).join('')}</tr></thead><tbody>${data.map((row,r)=>`<tr><th id="row${r}" scope="row">Lin. ${r}</th>${row.map((v,c)=>{let i=r*row.length+c,cl=picked.includes(i)?' selected':'';return `<td>${mode?`<button type="button" class="cell${cl}" data-cell="${i}" aria-label="Linha ${r}, coluna ${c}, valor ${v}" aria-pressed="${picked.includes(i)}">${v}</button>`:`<span class="cell${cl}" data-cell="${i}">${v}</span>`}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}
function warmup(){header();$('app').innerHTML=`<span class="tag">Aquecimento · sem pontuação</span><h2>Uma posição. Dois índices.</h2><p class="prompt">Clique em uma posição e veja como a linguagem C encontra o valor. Primeiro vem a linha; depois, a coluna.</p><div class="warmup">${matrix([[5,2,8],[1,7,3],[9,4,6]],'warm')}<p class="feedback" id="warmout" aria-live="polite">Experimente uma posição da matriz.</p></div><p class="note">10 missões · até 100 pontos · sem pressa.<br>Errou? Você pode tentar novamente ou seguir adiante. As dicas não descontam pontos.</p><label class="field">Seu nome completo <input type="text" id="student" autocomplete="name" maxlength="100" value="${esc(state.name)}" placeholder="Nome e sobrenome"></label><p class="small">Ao concluir, seu nome e sua pontuação serão enviados para o registro do professor.</p><button class="btn primary" id="start">Começar a missão →</button><p id="startmsg" role="status"></p>`;
$('app').querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{let i=+b.dataset.cell,r=Math.floor(i/3),c=i%3;$('app').querySelectorAll('.cell').forEach(x=>x.classList.toggle('selected',x===b));$('warmout').innerHTML=`<code>mapa[${r}][${c}]</code> guarda <strong>${[[5,2,8],[1,7,3],[9,4,6]][r][c]}</strong>.<br>Linha ${r} · coluna ${c}`;$('app').querySelectorAll('th').forEach(x=>x.classList.remove('indexlit'));$('row'+r).classList.add('indexlit');$('col'+c).classList.add('indexlit')});$('start').onclick=()=>{let name=$('student').value.trim();if(name.length<3){$('startmsg').textContent='Informe seu nome para identificar o resultado.';$('student').focus();return}state.name=name;state.started=true;save();render()}}
function select(k,options,draft){return `<select aria-label="Lacuna ${k+1}" data-input="${k}"><option value="">Escolha</option>${options.map(o=>`<option value="${esc(o)}" ${String(draft[k])===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
function codeBlanks(p,d){return '<div class="code">'+esc(p.code).replace(/\{(\d+)\}/g,(_,k)=>select(+k,p.options[k],d))+'</div>'}
function number(k,label,d){return `<label class="field">${label} <input type="number" step="1" inputmode="numeric" data-input="${k}" aria-label="${label}" value="${esc(d[k]??'')}"></label>`}
function body(p,a){let d=a.draft,grid=p.matrix?`<div class="panel">${matrix(p.matrix,['target','path'].includes(p.type)?p.type:'',p.type==='target'?d:p.type==='path'?[0,...d]:p.type==='choice'&&a.tries?[5]:[])}<p class="legend">${p.type==='count'?'0 = vazio · 1 = pedra · 2 = tesouro':'Linhas na horizontal · colunas na vertical'}</p></div>`:'',work='';
switch(p.type){case'target':work='<p>O acesso é <code>mapa[2][0]</code>.</p><p class="status">'+(d.length?'Posição escolhida: ['+Math.floor(d[0]/3)+']['+d[0]%3+']':'Escolha uma posição na matriz.')+'</p>';break;
case'match':work=`<div class="match">${['mapa[0][2]','mapa[1][0]','mapa[1][1]'].map((x,i)=>`<button class="choice ${pair===i?'selected':''}" data-pair="${i}">${x} → ${d[i]??'?'}</button><button class="choice" data-value="${[9,8,4][i]}">${[9,8,4][i]}</button>`).join('')}</div><p class="status">${pair===null?'Escolha um acesso à esquerda.':'Agora escolha seu valor à direita.'}</p>`;break;
case'blanks':work=codeBlanks(p,d);break;
case'choice':work=`<pre>${esc(p.code)}</pre><div class="choices">${p.choices.map((x,i)=>`<button class="choice ${d[0]===i?'selected':''}" data-choice="${i}" aria-pressed="${d[0]===i}">${esc(x)}</button>`).join('')}</div>`;if(a.tries)grid=`<div class="panel">${matrix([[0,1,0],[0,0,1],[1,0,0]],'',[5])}<p class="legend">Depois do comando · 0 = vazio · 1 = X</p></div>`;break;
case'path':work=`<pre>${esc(p.code)}</pre><p class="status">Partida: [0][0]<br>Seu caminho: ${d.map(i=>'['+Math.floor(i/3)+']['+i%3+']').join(' → ')||'clique nas três próximas posições'}</p><button class="btn" id="clearPath">Limpar caminho</button>`;break;
case'count':work=`<div class="code">if (mapa[linha][coluna] == ${select(0,['0','1','2'],d)}) {\n    tesouros = tesouros + 1;\n}</div><p class="small">Trecho dentro dos dois laços; tesouros começa em 0.</p>${number(1,'Quantidade de tesouros',d)}`;break;
case'sum':work=`<pre id="sumcode">${esc(p.code)}</pre>${number(0,'Total de energia da coluna 1',d)}${a.tries?`<div class="actions"><button class="btn" id="step">Próximo passo</button><button class="btn" id="resetSim">Reiniciar percurso</button></div><p class="status" id="simout" aria-live="polite">soma = 0 · nenhum valor visitado</p>`:''}`;break;
case'debug':work=`<p class="small">Os números à esquerda identificam as linhas do código. Clique em duas linhas com erro.</p><div class="panel" style="overflow-x:auto">${p.lines.map((l,i)=>`<button class="linebtn ${d.slice(0,2).includes(i)?'selected':''}" data-line="${i}" aria-pressed="${d.slice(0,2).includes(i)}">${i+1}  ${esc(l)}</button>`).join('')}</div><div class="corrections"><label class="field">Limite da condição do laço de linhas: linha &lt; ${select(2,['1','2','3'],d)}</label><label class="field">Índices de mapa no scanf ${select(3,['coluna][linha','linha][coluna','0][0'],d)}</label></div>`;break;
case'final':work=codeBlanks(p,d)+number(2,'Total da base 0',d)+number(3,'Total da base 1',d)+number(4,'Total da base 2',d);break;}
return `<div class="workspace ${grid?'':'single'}">${grid}<div>${work}</div></div>`}
function render(){if(!state.started){warmup();return}if(state.summary){summary();return}header();let p=phases[state.current],a=state.items[state.current];$('app').innerHTML=`<nav class="track" aria-label="Atividades">${phases.map((x,i)=>`<button class="dot ${i===state.current?'active':''} ${state.items[i].correct?'ok':state.items[i].tries?'tried':''}" data-go="${i}" aria-label="Atividade ${i+1}: ${x.title}, ${state.items[i].correct?'correta':state.items[i].tries?'respondida, revisar':'não respondida'}" ${i===state.current?'aria-current="step"':''}>${i+1}</button>`).join('')}</nav><span class="tag">${p.level} · 10 pontos</span><h2 tabindex="-1" id="phaseTitle">${state.current+1}. ${p.title}</h2><p class="prompt">${p.prompt}</p>${body(p,a)}<details class="hint" id="hint" ${a.hint?'open':''}><summary>Preciso de uma dica</summary><p>${p.hint}</p></details><div class="feedback ${a.correct?'good':a.tries?'bad':''}" role="status" aria-live="polite" id="feedback">${a.correct?'<strong>Correto! +10 pontos nesta atividade.</strong> '+p.explain:a.tries?(state.finished?'<strong>Para revisar:</strong> '+p.explain:'<strong>Ainda não.</strong> '+a.message+' Você pode tentar novamente ou avançar.'):''}</div><div class="nav"><button class="btn" id="prev" ${state.current===0?'disabled':''}>← Anterior</button><button class="btn primary" id="check" ${a.correct||state.finished?'disabled':''}>${a.correct?'✓ Resolvida':'Conferir resposta'}</button><button class="btn" id="next" ${!a.tries?'disabled':''}>${state.current===9?(state.finished?'Ver resumo':'Concluir e registrar'):'Próxima →'}</button></div>${state.finished?'<p class="small">Revisão da tentativa concluída. Para responder novamente, use Recomeçar.</p>':''}`;
$('app').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));$('prev').onclick=()=>go(state.current-1);$('next').onclick=next;$('check').onclick=check;$('hint').ontoggle=()=>{if($('hint').open&&!a.hint&&!state.finished){a.hint=true;save()}};
const locked=a.correct||state.finished;
$('app').querySelectorAll('[data-input]').forEach(el=>{el.disabled=locked;el.onchange=()=>{a.draft[+el.dataset.input]=el.value;save()};el.oninput=el.onchange});
$('app').querySelectorAll('[data-cell]').forEach(el=>{if(el.tagName!=='BUTTON')return;el.disabled=locked;el.onclick=()=>{let v=+el.dataset.cell;if(p.type==='target')a.draft=[v];else if(p.type==='path'){if(a.draft.length>=3){$('feedback').textContent='Você já escolheu três posições. Confira ou limpe o caminho.';return}a.draft.push(v)}save();render()}});
$('app').querySelectorAll('[data-choice]').forEach(el=>{el.disabled=locked;el.onclick=()=>{a.draft=[+el.dataset.choice];save();render()}});
$('app').querySelectorAll('[data-pair]').forEach(el=>{el.disabled=locked;el.onclick=()=>{pair=+el.dataset.pair;render()}});
$('app').querySelectorAll('[data-value]').forEach(el=>{el.disabled=locked;el.onclick=()=>{if(pair===null){$('feedback').textContent='Primeiro escolha um acesso à esquerda.';return}a.draft[pair]=+el.dataset.value;pair=null;save();render()}});
$('app').querySelectorAll('[data-line]').forEach(el=>{el.disabled=locked;el.onclick=()=>{let v=+el.dataset.line,arr=a.draft.slice(0,2).filter(x=>Number.isInteger(x));arr=arr.includes(v)?arr.filter(x=>x!==v):arr.length<2?[...arr,v]:[arr[1],v];a.draft=[arr[0]??null,arr[1]??null,a.draft[2]??'',a.draft[3]??''];save();render()}});
if($('clearPath')){$('clearPath').disabled=locked;$('clearPath').onclick=()=>{a.draft=[];save();render()}}
if($('step')){$('step').onclick=step;$('resetSim').onclick=()=>{simStep=0;drawSim()};drawSim()}
}
function go(i){if(i<0||i>9||busy)return;state.current=i;state.summary=false;pair=null;simStep=0;save();render();$('phaseTitle')?.focus()}
function equal(a,b){if(String(a).trim()!==''&&String(b).trim()!==''&&Number.isFinite(Number(a))&&Number.isFinite(Number(b)))return Number(a)===Number(b);return String(a)===String(b)}
function complete(p,d){if(p.type==='debug')return [0,1,2,3].every(i=>d[i]!==undefined&&d[i]!==null&&d[i]!=='');return p.answer.every((_,i)=>d[i]!==undefined&&d[i]!==null&&String(d[i]).trim()!=='')}
function check(){let p=phases[state.current],a=state.items[state.current];if(a.correct||state.finished)return;let d=a.draft;if(!complete(p,d)){$('feedback').textContent='Complete sua resposta antes de conferir. Depois de responder, você poderá avançar mesmo se errar.';return}let ok=p.type==='debug'?[...d.slice(0,2)].sort((a,b)=>a-b).join(',')==='5,7'&&d[2]==='2'&&d[3]==='linha][coluna':p.answer.every((v,i)=>equal(d[i],v));a.tries++;if(a.tries===1)a.first=ok;a.correct=ok;a.message=p.type==='path'?'Confira a ordem: o laço de colunas termina antes de mudar a linha.':p.type==='target'?'Confira a ordem dos índices: primeiro linha, depois coluna.':p.type==='debug'?'Compare os limites com as dimensões declaradas e mantenha linha antes de coluna no scanf.':p.type==='final'?'Confira onde soma é zerada e calcule uma base por vez.':p.type==='sum'?'Some apenas os valores da segunda coluna. Você também pode acompanhar o percurso abaixo.':p.type==='match'?'Confira cada acesso usando primeiro a linha e depois a coluna.':p.hint;save();render()}
function step(){simStep=Math.min(3,simStep+1);drawSim()}
function drawSim(){let cells=$('app').querySelectorAll('[data-cell]');cells.forEach(el=>{let i=+el.dataset.cell,r=Math.floor(i/3);el.classList.toggle('visited',i%3===1&&r<simStep);el.classList.toggle('current',i%3===1&&r===simStep-1)});$('simout').textContent=simStep?`linha = ${simStep-1} · coluna fixa = 1 · soma = ${[0,4,7,12][simStep]}${simStep===3?' · percurso concluído':''}`:'soma = 0 · nenhum valor visitado';$('step').disabled=simStep===3;$('sumcode').innerHTML=phases[7].code.split('\n').map((l,i)=>`<span class="${simStep&&(simStep===3?i===4:i===2)?'selectedline':''}">${esc(l)}</span>`).join('\n')}
function next(){if(busy||!state.items[state.current].tries)return;if(state.current<9){go(state.current+1);return}let pending=state.items.findIndex(a=>!a.tries);if(pending>=0){$('feedback').textContent=`Falta responder a atividade ${pending+1}. Você pode errar e avançar, mas tente todas antes de concluir.`;return}if(!state.finished){state.finished=true;state.completedAt=new Date().toISOString();state.summary=true;save();summary();sendResult()}else{state.summary=true;save();summary()}}
function report(){let first=state.items.filter(a=>a.first).length;return `${TITLE}\nProf. Cristhiano Vasconcellos\nEstudante: ${state.name}\nConcluída em: ${new Date(state.completedAt).toLocaleString('pt-BR')}\nPontuação: ${points()}/100\nAcertos na primeira tentativa: ${first}/10\nErros nas tentativas: ${errors()}\n\n`+phases.map((p,i)=>`${i+1}. ${p.title}: ${state.items[i].correct?(state.items[i].first?'acertou de primeira':'resolveu após tentar novamente'):'respondeu e precisa revisar'} | tentativas: ${state.items[i].tries} | dica: ${state.items[i].hint?'sim':'não'}`).join('\n')}
function errors(){return state.items.reduce((s,a)=>s+a.tries-(a.correct?1:0),0)}
function download(){let u=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='resumo_missao_matrizes_c.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function summary(){header();let first=state.items.filter(a=>a.first).length,later=state.items.filter(a=>a.correct&&!a.first).length,status={idle:'Seu resultado está pronto para envio.',sending:'Enviando o resultado…',sent:'Resultado encaminhado para registro. Este sistema não confirma a gravação na planilha.',failed:'Não foi possível concluir o envio. Verifique a internet e tente novamente.',uncertain:'O envio anterior não pôde ser confirmado. Confira com o professor antes de reenviar.'}[state.send];$('app').innerHTML=`<span class="tag">Percurso concluído</span><h2>Missão cumprida, ${esc(state.name.split(' ')[0])}!</h2><p class="prompt">Você passou dos índices aos laços e ao processamento das matrizes em C. Confira seu percurso.</p><div class="stats"><div class="stat"><strong>${points()}/100</strong><span>Pontos conquistados</span></div><div class="stat"><strong>${first}</strong><span>Acertos de primeira</span></div><div class="stat"><strong>${later}</strong><span>Resolvidas após tentar</span></div></div><ul class="resultlist">${phases.map((p,i)=>`<li><span>${i+1}. ${p.title}</span><strong>${state.items[i].correct?(state.items[i].first?'✓ De primeira':'✓ Após tentar'):'↻ Revisar'}</strong></li>`).join('')}</ul><div class="sendbox" role="status"><strong>Registro do professor</strong><p>${status}</p><p class="small">${esc(state.name)} · ${points()} de 100 pontos</p>${['idle','failed','uncertain'].includes(state.send)?'<button class="btn primary" id="send">'+(state.send==='idle'?'Enviar resultado':'Tentar enviar novamente')+'</button>':''}</div><div class="actions"><button class="btn primary" id="review">Revisar atividades</button><button class="btn" id="download">Baixar meu resumo</button><button class="btn" id="again">Refazer do início</button><a class="btn" href="objetos.html">Voltar aos objetos</a></div>`;$('review').onclick=()=>go(0);$('download').onclick=download;$('again').onclick=restart;if($('send'))$('send').onclick=sendResult}
async function sendResult(){if(busy||state.send==='sent')return;busy=true;state.send='sending';save();summary();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),18000);try{await fetch(URL_WEBAPP,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({nome:state.name,atividade:TITLE,acertos:points(),total:100,erros:errors()}),signal:controller.signal,cache:'no-store',keepalive:true});state.send='sent'}catch(e){state.send=e.name==='AbortError'?'uncertain':'failed'}finally{clearTimeout(timer);busy=false;save();if(state.summary)summary()}}
function restart(){if(busy){alert('Aguarde o envio terminar antes de recomeçar.');return}if(!confirm('Começar uma nova tentativa? As respostas e os pontos desta tentativa serão apagados deste navegador.'))return;state=fresh();pair=null;simStep=0;save();render()}
$('focus').onclick=()=>{state.focus=!state.focus;save();header()};$('restart').onclick=restart;save();render();
</script></body></html>
