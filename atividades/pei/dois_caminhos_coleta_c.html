<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dois caminhos na coleta</title></head>
<body><p style="font:18px system-ui;padding:24px">Carregando atividade...</p>
<script id="machinePatch" type="text/plain">function renderMachine(s){const last=state.machine.last;const has=last!==null;const good=has&&Number(last)>5;const val=has?last:"—";const question=has?`${last} > 5 ?`:"—";const truth=has?(good?"SIM — VERDADEIRO":"NÃO — FALSO"):"—";const path=has?(good?"IF":"ELSE"):"—";const msg=has?(good?"Boa coleta!":"Vamos continuar coletando!"):"—";const decision=C`if (latinhas > 5) {
    printf("Boa coleta!");
} else {
    printf("Vamos continuar coletando!");
}`;frame(s,`<p><strong>Vamos acompanhar a decisão passo a passo.</strong></p><p>Comece clicando em <strong>Testar 3</strong>. Depois teste <strong>8</strong> e <strong>5</strong>.</p>${code(decision)}<div class="machine"><div class="preset"><button data-value="3">Testar 3</button><button data-value="8">Testar 8</button><button data-value="5">Testar 5</button></div><div class="lab-row"><div class="lab-field"><label for="machineValue">Ou digite outro valor</label><input id="machineValue" type="number" min="0" max="99" step="1"></div><button id="runMachine" class="primary">Executar</button></div><div class="machine-track"><div class="machine-cell"><div><span class="small">1. VALOR</span><br><strong>${esc(val)}</strong><br><code>latinhas</code></div></div><div class="machine-arrow">→</div><div class="machine-cell ${has?(good?"true":"false"):""}"><div><span class="small">2. PERGUNTA</span><br><strong>${esc(question)}</strong><br>${esc(truth)}</div></div><div class="machine-arrow">→</div><div class="machine-cell ${has?(good?"true":"false"):""}"><div><span class="small">3. CAMINHO</span><br><strong>${esc(path)}</strong></div></div><div class="machine-arrow">→</div><div class="machine-cell ${has?(good?"true":"false"):""}"><div><span class="small">4. RESULTADO</span><br><strong>${esc(msg)}</strong></div></div></div><p class="small">Testes feitos nesta máquina: <strong>${state.machine.tests}</strong>.</p></div><p class="note">Leia da esquerda para a direita: valor → pergunta → caminho → resultado.</p>${nextNav(s)}`);const run=v=>{const n=Number(v);if(!Number.isInteger(n)||n<0||n>99)return false;state.machine.last=n;state.machine.tests++;state.machine.values.push(n);save();renderMachine(s);return true;};document.querySelectorAll("[data-value]").forEach(b=>b.onclick=()=>run(b.dataset.value));$("runMachine").onclick=()=>{if(!run($("machineValue").value))alert("Digite um número inteiro entre 0 e 99.");};bindNav();}
</script>
<script>
(async()=>{
  const machine=document.getElementById('machinePatch').textContent.trim()+"\n";
  let src=await fetch('dois_caminhos_coleta_c_base.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Não foi possível carregar a atividade-base.');return r.text();});
  const decision='C`if (latinhas > 5) {\n    printf("Boa coleta!");\n} else {\n    printf("Vamos continuar coletando!");\n}`';
  const p3='{phase:2,id:"pred3",category:"Previsão",points:1,title:"Preveja com 3 latinhas",kind:"quiz",prompt:"latinhas vale 3. Qual mensagem aparece?",options:';
  const p5='{phase:2,id:"pred5",category:"Previsão",points:1,title:"Atenção ao valor 5",kind:"quiz",prompt:"latinhas vale exatamente 5. Qual mensagem aparece?",options:';
  if(!src.includes(p3)||!src.includes(p5))throw new Error('Etapas 9/10 não encontradas.');
  src=src.replace(p3,p3.slice(0,-8)+'visual:()=>code('+decision+'),options:');
  src=src.replace(p5,p5.slice(0,-8)+'visual:()=>code('+decision+'),options:');
  const old13='{phase:3,id:"huntElse",category:"Leitura de código",points:1,title:"Ache o segundo caminho",kind:"hunt",prompt:"Clique na linha que inicia o caminho usado quando a condição é falsa.",lines:["if (latinhas > 5) {",\'    printf("Boa coleta!");\',"} else {",\'    printf("Vamos continuar coletando!");\',"}"],correct:2,why:"A palavra else inicia o caminho usado quando a condição do if é falsa.",hint:"Procure a palavra que significa SENÃO.",help:"A palavra é else."},';
  const new13='{phase:3,id:"huntElse",category:"Leitura de código",points:1,title:"Encontre o else",kind:"quiz",prompt:"Qual palavra do programa significa SENÃO?",visual:()=>code('+decision+'),options:["if","else","printf"],correct:1,why:"Isso! else significa SENÃO. Ele é usado quando a condição do if é falsa.",hint:"Procure a palavra que vem depois do primeiro bloco.",help:"A palavra é else."},';
  if(!src.includes(old13))throw new Error('Etapa 13 não encontrada.');
  src=src.replace(old13,new13);
  const a=src.indexOf('function renderMachine(s){'),b=src.indexOf('function renderHunt(s){',a);
  if(a<0||b<0)throw new Error('Máquina não encontrada.');
  src=src.slice(0,a)+machine+src.slice(b);
  src=src.replace('.machine-track{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;','.machine-track{display:grid;grid-template-columns:1fr auto 1.25fr auto 1fr auto 1.4fr;gap:10px;');
  src=src.replaceAll('${nextNav(s,r.solved)}','${nextNav(s,true)}');
  src=src.replaceAll('Você pode mudar a resposta e tentar novamente.','Você pode mudar a resposta e tentar novamente ou continuar e voltar depois.');
  src=src.replace('Você acertou <strong>${score} de ${s.points}</strong>. Revise e tente novamente.','Você acertou <strong>${score} de ${s.points}</strong>. Você pode revisar e tentar novamente ou continuar e voltar depois.');
  src=src.replace('Observe novamente e tente.','Observe novamente e tente. Se quiser, você pode continuar e voltar depois.');
  src=src.replace('Ainda não está na ordem correta. Use a pista ou mova os blocos e tente novamente.','Ainda não está na ordem correta. Use a pista, tente novamente ou continue e volte depois.');
  document.open();document.write(src);document.close();
})().catch(e=>{document.body.innerHTML='<main style="max-width:760px;margin:40px auto;font:18px system-ui"><h1>Não foi possível abrir a atividade</h1><p>'+String(e.message).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p></main>';});
</script>
</body></html>
