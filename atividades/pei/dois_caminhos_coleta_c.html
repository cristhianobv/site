<style>

.order-list{display:grid;gap:11px;margin:20px 0}.order-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:11px;padding:10px 10px 10px 14px;background:#fff}.order-code{font-family:Consolas,monospace;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}.order-buttons{display:flex;gap:6px}.order-buttons button{min-height:42px;padding:6px 11px;font-weight:900}
.code-lines{display:grid;gap:8px;margin:20px 0}.code-line{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr);text-align:left;padding:0;border:2px solid var(--line);overflow:hidden}.code-line .ln{padding:12px 10px;background:#edf1ef;text-align:center;font:15px Consolas,monospace;color:var(--muted)}.code-line .src{padding:12px 13px;font:16px Consolas,monospace;white-space:pre-wrap}.code-line.selected{border-color:var(--green);background:var(--soft)}.code-option{align-items:stretch}.code-option pre{margin:0;flex:1;font-size:15px;padding:13px}.code-option pre code{background:transparent;color:inherit;padding:0;border-radius:0}

<dialog id="restartDialog"><h2>Começar novamente?</h2><p>As respostas desta atividade serão apagadas deste navegador. Se quiser guardar o resultado atual, baixe o resumo antes.</p><div class="actions"><button id="cancelRestart">Manter meu progresso</button><button class="primary" id="confirmRestart">Apagar e recomeçar</button></div></dialog>

<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const KEY="dois-caminhos-coleta-c-v1";
const DESTINO="cristhiano.vasconcellos@iffarroupilha.edu.br";
const TITULO="Dois caminhos na coleta — aprendendo if/else em C";
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const C=String.raw;
const code=v=>`<pre><code>${esc(v)}</code></pre>`;
const fullProgram=C`#include <stdio.h>

int main() {
    int latinhas;

    printf("Quantas latinhas foram coletadas? ");
    scanf("%d", &latinhas);

    if (latinhas > 5) {
        printf("Boa coleta!\\n");
    } else {
        printf("Vamos continuar coletando!\\n");
    }

    return 0;
}`;
const fresh=()=>({version:1,page:0,studentName:"",started:new Date().toISOString(),records:{},matchSelected:null,machine:{tests:0,values:[],last:null},practice:{downloaded:false,three:false,five:false,eight:false},reflection:{autonomy:"",easiest:[],note:""}});
let state=fresh(),resumeAvailable=false,storageAvailable=true,sending=false;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1&&Number.isInteger(saved.page)&&saved.records&&typeof saved.records==="object"){state={...fresh(),...saved};state.machine={...fresh().machine,...(saved.machine||{})};state.practice={...fresh().practice,...(saved.practice||{})};state.reflection={...fresh().reflection,...(saved.reflection||{})};resumeAvailable=true;}}catch(_){ }
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(_){storageAvailable=false;}}
function rec(id){if(!state.records[id]||typeof state.records[id]!=="object")state.records[id]={};const r=state.records[id];r.attempts=Number.isInteger(r.attempts)?r.attempts:0;r.hints=Number.isInteger(r.hints)?r.hints:0;r.helps=Number.isInteger(r.helps)?r.helps:0;r.history=Array.isArray(r.history)?r.history:[];r.solved=r.solved===true;return r;}
function download(name,text){const u=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function box(name,value,caption=""){return `<div class="box"><span class="tag">${esc(name)}</span><strong>${esc(value)}</strong>${caption?`<span class="small">${esc(caption)}</span>`:""}</div>`;}
const screens=[
 {phase:1,title:"Do if para dois caminhos",kind:"read",body:()=>`<p>Você já sabe que o <code>if</code> verifica uma condição.</p><p>Agora vamos acrescentar apenas uma ideia nova: quando a condição for <strong>falsa</strong>, o programa também poderá fazer alguma coisa.</p><div class="path-grid"><div class="path-card true"><strong>SE for verdadeiro</strong><br>faz um caminho</div><div class="path-arrow">↔</div><div class="path-card false"><strong>SENÃO</strong><br>faz outro caminho</div></div><p class="note">Nesta atividade, continuaremos usando a mesma condição: <code>latinhas &gt; 5</code>. Assim, você aprende somente a novidade: <code>else</code>.</p>`},
 {phase:1,id:"reviewIf",category:"Revisão",points:1,title:"Relembrando o if",kind:"quiz",prompt:"latinhas vale 8. A condição latinhas > 5 é...",options:["Verdadeira","Falsa"],correct:0,why:"8 é maior que 5. A condição é verdadeira.",hint:"Compare 8 com 5.",help:"O símbolo > significa maior que. Pergunte: 8 é maior que 5?"},
 {phase:1,id:"reviewFive",category:"Revisão",points:1,title:"E quando vale exatamente 5?",kind:"quiz",prompt:"latinhas vale 5. A condição latinhas > 5 é...",options:["Verdadeira","Falsa"],correct:1,why:"5 não é maior que 5. Os valores são iguais.",hint:"O símbolo é >, não >=.",help:"Para ser verdadeiro, o valor da esquerda precisa ser maior que 5."},
 {phase:1,title:"O que faltava no programa?",kind:"read",body:()=>`<p>Com apenas o <code>if</code>, quando a condição era falsa, o programa simplesmente pulava o bloco.</p>${code(C`if (latinhas > 5) {
    printf("Boa coleta!");
}`)}<p>Agora queremos responder também ao outro caso.</p><div class="visual">${box("8","Boa coleta!")}<span class="symbol">|</span>${box("3","Vamos continuar!")}</div>`},
 {phase:1,id:"meaningElse",category:"Novo conteúdo",points:1,title:"Conhecendo o else",kind:"quiz",prompt:"No if/else, quando o programa chega ao else?",options:["Quando a condição do if é verdadeira","Quando a condição do if é falsa","Sempre, depois do if"],correct:1,why:"O else representa o outro caminho: ele é executado quando a condição do if é falsa.",hint:"Pense em else como SENÃO.",help:"SE a condição for verdadeira, faça o if. SENÃO, faça o else."},
 {phase:1,title:"A nova estrutura em C",kind:"read",body:()=>`${code(C`if (latinhas > 5) {
    printf("Boa coleta!\\n");
} else {
    printf("Vamos continuar coletando!\\n");
}`)}<p class="note"><strong>Um teste, dois caminhos.</strong> Apenas um dos blocos é executado em cada passagem.</p>`},
 {phase:2,id:"matchPaths",category:"Associação",points:4,title:"Associe cada parte ao que ela faz",kind:"match",left:["if","latinhas > 5","bloco do if","else"],right:["Executa quando a condição é falsa","É a pergunta feita pelo programa","Inicia a decisão","Executa quando a condição é verdadeira"],correct:[2,1,3,0],hint:"Comece pelo que você já conhece: if inicia a decisão.",help:"if inicia; a condição é a pergunta; o bloco do if é o caminho verdadeiro; else é o caminho falso."},
 {phase:2,id:"pred8",category:"Previsão",points:1,title:"Preveja com 8 latinhas",kind:"quiz",prompt:"latinhas vale 8. Qual mensagem aparece?",visual:()=>code(C`if (latinhas > 5) {
    printf("Boa coleta!");
} else {
    printf("Vamos continuar coletando!");
}`),options:["Boa coleta!","Vamos continuar coletando!","As duas mensagens"],correct:0,why:"8 > 5 é verdadeiro, então o bloco do if é executado.",hint:"Primeiro descubra se 8 > 5 é verdadeiro.",help:"Quando o if é verdadeiro, o else é ignorado."},
 {phase:2,id:"pred3",category:"Previsão",points:1,title:"Preveja com 3 latinhas",kind:"quiz",prompt:"latinhas vale 3. Qual mensagem aparece?",options:["Boa coleta!","Vamos continuar coletando!","Nenhuma mensagem"],correct:1,why:"3 > 5 é falso. Por isso o programa segue pelo else.",hint:"3 é maior que 5?",help:"Quando a condição do if é falsa, entra o else."},
 {phase:2,id:"pred5",category:"Previsão",points:1,title:"Atenção ao valor 5",kind:"quiz",prompt:"latinhas vale exatamente 5. Qual mensagem aparece?",options:["Boa coleta!","Vamos continuar coletando!","As duas mensagens"],correct:1,why:"5 > 5 é falso. Então o programa executa o else.",hint:"Igual não é maior.",help:"Como usamos >, o número 5 fica no caminho do else."},
 {phase:2,title:"Máquina dos dois caminhos",kind:"machine"},
 {phase:3,id:"huntIf",category:"Leitura de código",points:1,title:"Ache o caminho verdadeiro",kind:"hunt",prompt:"Clique na linha que mostra a mensagem quando a condição é verdadeira.",lines:["if (latinhas > 5) {",'    printf("Boa coleta!");',"} else {",'    printf("Vamos continuar coletando!");',"}"],correct:1,why:"Esse printf está dentro do bloco do if.",hint:"Procure a mensagem Boa coleta!.",help:"O caminho verdadeiro fica entre o if e o else."},
 {phase:3,id:"huntElse",category:"Leitura de código",points:1,title:"Ache o segundo caminho",kind:"hunt",prompt:"Clique na linha que inicia o caminho usado quando a condição é falsa.",lines:["if (latinhas > 5) {",'    printf("Boa coleta!");',"} else {",'    printf("Vamos continuar coletando!");',"}"],correct:2,why:"A palavra else inicia o caminho usado quando a condição do if é falsa.",hint:"Procure a palavra que significa SENÃO.",help:"A palavra é else."},
 {phase:3,id:"detElse",category:"Detetive de erros",points:1,title:"Detetive: qual estrutura está correta?",kind:"codequiz",prompt:"Escolha a forma correta de escrever if/else em C.",options:[C`if (latinhas > 5) {
    printf("Boa coleta!");
} else {
    printf("Vamos continuar!");
}`,C`if (latinhas > 5) {
    printf("Boa coleta!");
} else (latinhas <= 5) {
    printf("Vamos continuar!");
}`],correct:0,why:"O else não precisa repetir uma condição: ele representa todos os casos em que o if foi falso.",hint:"Procure a opção em que else aparece sozinho.",help:"Usamos simplesmente else { ... }."},
 {phase:3,id:"orderDecision",category:"Sequência",points:1,title:"Monte apenas a decisão",kind:"order",blocks:["if (latinhas > 5) {",'    printf("Boa coleta!");',"} else {",'    printf("Vamos continuar coletando!");',"}"],start:[2,0,4,1,3],correct:[0,1,2,3,4],hint:"O else vem depois de fechar o bloco verdadeiro.",help:"if → mensagem verdadeira → } else { → mensagem falsa → }"},
 {phase:4,id:"mission",category:"Missão final",points:1,title:"Missão final: monte o programa",kind:"order",mission:true,blocks:["int latinhas;",'scanf("%d", &latinhas);',C`if (latinhas > 5) {
    printf("Boa coleta!\\n");
} else {
    printf("Vamos continuar coletando!\\n");
}`,"return 0;"],start:[2,3,0,1],correct:[0,1,2,3],hint:"Primeiro crie a variável, depois receba o valor, então decida e finalize.",help:"criar → receber → decidir → finalizar"},
 {phase:4,title:"Teste no C de verdade",kind:"practice"},
 {phase:4,title:"Como foi para você?",kind:"reflection"}
];
const scored=screens.filter(s=>s.id);const totalPoints=scored.reduce((n,s)=>n+(s.points||1),0);scored.forEach(s=>{if(state.records[s.id])rec(s.id);});
function phaseName(p){return({1:"Entender o segundo caminho",2:"Prever decisões",3:"Ler e montar o código",4:"Missão e prática"})[p]||"";}
function frame(s,contents,showProgress=true){const p=s.phase;$("main").innerHTML=`${showProgress?`<div class="phasebar"><div class="eyebrow">Etapa ${state.page+1} de ${screens.length}</div>${p?`<div class="phasepill">${esc(phaseName(p))}</div>`:""}</div><progress aria-label="Posição na atividade" max="${screens.length}" value="${state.page+1}"></progress>`:""}<section class="card"><h1 id="heading" tabindex="-1">${esc(s.title)}</h1>${contents}</section>`;$("storageNote").textContent=storageAvailable?"Seu progresso fica salvo neste navegador. Você pode parar e continuar depois.":"O navegador não permitiu salvar. Baixe seu resumo antes de fechar.";$("heading")?.focus({preventScroll:true});window.scrollTo(0,0);}
function feedback(text,good=false){const el=$("feedback");if(!el)return;el.className="feedback"+(good?" good":"");el.innerHTML=text;}
function nextNav(s,unlocked=true){return `<nav aria-label="Navegação da atividade"><button id="back" ${state.page===0?"disabled":""}>Voltar</button><button id="next" class="primary" ${unlocked?"":"disabled"}>${state.page===screens.length-1?"Ver meu resumo":"Continuar"}</button></nav>`;}
function bindNav(){const b=$("back"),n=$("next");if(b)b.onclick=()=>{state.page--;save();render();};if(n)n.onclick=()=>{if(state.page===screens.length-1){save();showSummary();return;}state.page++;save();render();};}
function supportButtons(s,r){return `<div class="actions"><button id="hint">Quero uma pista</button><button id="help">Não lembro</button></div>`;}
function bindSupport(s,r){if($("hint"))$("hint").onclick=()=>{r.hints++;save();feedback(esc(s.hint||"Observe com calma e tente novamente."));};if($("help"))$("help").onclick=()=>{r.helps++;save();feedback(esc(s.help||s.hint||"Revise o exemplo antes de continuar."));};}
function registerResult(s,score,max,answer){const r=rec(s.id);r.attempts++;const correct=score===max;const item={score,max,correct,answer:String(answer??""),hints:r.hints,helps:r.helps,time:new Date().toISOString()};r.history.push(item);if(r.firstScore===undefined)r.firstScore=score;if(r.firstMax===undefined)r.firstMax=max;if(correct&&!r.solved){r.solved=true;r.success={attempt:r.attempts,hints:r.hints,helps:r.helps};}save();return correct;}
function render(){state.page=Math.max(0,Math.min(state.page,screens.length-1));const s=screens[state.page];if(s.kind==="read")return renderRead(s);if(s.kind==="quiz"||s.kind==="codequiz")return renderQuiz(s);if(s.kind==="match")return renderMatch(s);if(s.kind==="machine")return renderMachine(s);if(s.kind==="hunt")return renderHunt(s);if(s.kind==="order")return renderOrder(s);if(s.kind==="practice")return renderPractice(s);if(s.kind==="reflection")return renderReflection(s);}
function renderRead(s){frame(s,`${s.body?s.body():""}${nextNav(s)}`);bindNav();}
function renderQuiz(s){const r=rec(s.id);const selected=r.draft!==undefined?r.draft:null;const vis=s.visual?(typeof s.visual==="function"?s.visual():s.visual):"";const opts=s.options.map((o,i)=>`<label class="option ${s.kind==="codequiz"?"code-option":""}"><input type="radio" name="answer" value="${i}" ${selected===i?"checked":""}>${s.kind==="codequiz"?code(o):`<span>${esc(o)}</span>`}</label>`).join("");frame(s,`<p>${esc(s.prompt)}</p>${vis}<div class="options">${opts}</div><div class="actions"><button id="check" class="primary">Conferir</button></div>${supportButtons(s,r)}<div id="feedback" class="feedback" role="status" aria-live="polite"></div>${nextNav(s,r.solved)}`);document.querySelectorAll('input[name="answer"]').forEach(el=>el.onchange=()=>{r.draft=Number(el.value);save();});$("check").onclick=()=>{if(r.draft===undefined||r.draft===null){feedback("Escolha uma resposta antes de conferir.");return;}const ok=registerResult(s,r.draft===s.correct?1:0,1,s.options[r.draft]);if(ok){feedback(`<strong>Correto!</strong> ${esc(s.why)}`,true);$("next").disabled=false;}else feedback(`${esc(s.why)} Você pode mudar a resposta e tentar novamente.`);};bindSupport(s,r);bindNav();if(r.solved){feedback(`<strong>Resolvido.</strong> ${esc(s.why)}`,true);$("next").disabled=false;}}
function renderMatch(s){const r=rec(s.id);if(!r.draft||typeof r.draft!=="object"||Array.isArray(r.draft))r.draft={};const selected=Number.isInteger(state.matchSelected)?state.matchSelected:null;const left=s.left.map((item,i)=>{const paired=r.draft[i]!==undefined?s.right[r.draft[i]]:"Ainda sem par";return `<button class="match-card ${selected===i?"selected":""} ${r.draft[i]!==undefined?"paired":""}" data-left="${i}"><strong>${esc(item)}</strong><span class="pair-label">→ ${esc(paired)}</span></button>`;}).join("");const used=new Set(Object.values(r.draft).map(Number));const right=s.right.map((item,i)=>`<button class="match-card ${used.has(i)?"paired":""}" data-right="${i}">${esc(item)}</button>`).join("");frame(s,`<div class="match-instruction"><strong>Como fazer:</strong> clique primeiro em um cartão da esquerda e depois no significado correto da direita.</div><div class="match-grid"><div class="match-col"><div class="match-title">Parte</div>${left}</div><div class="match-col"><div class="match-title">O que faz</div>${right}</div></div><div class="actions"><button id="clearPairs">Limpar associações</button><button id="check" class="primary">Conferir</button></div>${supportButtons(s,r)}<div id="feedback" class="feedback" role="status" aria-live="polite"></div>${nextNav(s,r.solved)}`);document.querySelectorAll("[data-left]").forEach(b=>b.onclick=()=>{state.matchSelected=Number(b.dataset.left);save();renderMatch(s);});document.querySelectorAll("[data-right]").forEach(b=>b.onclick=()=>{if(!Number.isInteger(state.matchSelected)){feedback("Primeiro escolha um cartão do lado esquerdo.");return;}const ri=Number(b.dataset.right);Object.keys(r.draft).forEach(k=>{if(Number(r.draft[k])===ri)delete r.draft[k];});r.draft[state.matchSelected]=ri;state.matchSelected=null;save();renderMatch(s);});$("clearPairs").onclick=()=>{r.draft={};state.matchSelected=null;save();renderMatch(s);};$("check").onclick=()=>{if(Object.keys(r.draft).length<s.left.length){feedback("Faça todas as associações antes de conferir.");return;}let score=0;s.correct.forEach((v,i)=>{if(Number(r.draft[i])===v)score++;});const desc=s.left.map((x,i)=>`${x} → ${s.right[r.draft[i]]||"?"}`).join(" | ");const ok=registerResult(s,score,s.points,desc);if(ok){feedback("<strong>Todas as associações estão corretas!</strong>",true);$("next").disabled=false;}else feedback(`Você acertou <strong>${score} de ${s.points}</strong>. Revise e tente novamente.`);};bindSupport(s,r);bindNav();if(r.solved){feedback("Associações resolvidas.",true);$("next").disabled=false;}}
function renderMachine(s){const last=state.machine.last;const good=last!==null&&Number(last)>5;const val=last===null?"—":last;const msg=last===null?"—":(good?"Boa coleta!":"Vamos continuar coletando!");frame(s,`<p>Escolha um número e veja qual caminho o programa escolhe.</p><div class="machine"><div class="preset"><button data-value="3">Testar 3</button><button data-value="5">Testar 5</button><button data-value="8">Testar 8</button></div><div class="lab-row"><div class="lab-field"><label for="machineValue">Ou digite outro valor</label><input id="machineValue" type="number" min="0" max="99" step="1"></div><button id="runMachine" class="primary">Executar</button></div><div class="machine-track"><div class="machine-cell"><div><span class="small">VALOR</span><br><strong>${esc(val)}</strong><br><code>latinhas</code></div></div><div class="machine-arrow">→</div><div class="machine-cell ${last===null?"":(good?"true":"false")}"><div><span class="small">CAMINHO ESCOLHIDO</span><br><strong>${last===null?"—":(good?"IF":"ELSE")}</strong><br>${esc(msg)}</div></div></div><p class="small">Testes feitos nesta máquina: <strong>${state.machine.tests}</strong>.</p></div><p class="note">Em cada execução, apenas um caminho acontece: <code>if</code> ou <code>else</code>.</p>${nextNav(s)}`);const run=v=>{const n=Number(v);if(!Number.isInteger(n)||n<0||n>99)return false;state.machine.last=n;state.machine.tests++;state.machine.values.push(n);save();renderMachine(s);return true;};document.querySelectorAll("[data-value]").forEach(b=>b.onclick=()=>run(b.dataset.value));$("runMachine").onclick=()=>{if(!run($("machineValue").value))alert("Digite um número inteiro entre 0 e 99.");};bindNav();}
function renderHunt(s){const r=rec(s.id);const selected=r.draft!==undefined?r.draft:null;const lines=s.lines.map((line,i)=>`<button class="code-line ${selected===i?"selected":""}" data-line="${i}"><span class="ln">${i+1}</span><span class="src">${esc(line)}</span></button>`).join("");frame(s,`<p>${esc(s.prompt)}</p><div class="code-lines">${lines}</div><div class="actions"><button id="check" class="primary">Conferir</button></div>${supportButtons(s,r)}<div id="feedback" class="feedback" role="status" aria-live="polite"></div>${nextNav(s,r.solved)}`);document.querySelectorAll("[data-line]").forEach(b=>b.onclick=()=>{r.draft=Number(b.dataset.line);save();renderHunt(s);});$("check").onclick=()=>{if(r.draft===undefined){feedback("Clique em uma linha antes de conferir.");return;}const ok=registerResult(s,r.draft===s.correct?1:0,1,`Linha ${r.draft+1}`);if(ok){feedback(`<strong>Você encontrou!</strong> ${esc(s.why)}`,true);$("next").disabled=false;}else feedback(`${esc(s.why)} Observe novamente e tente.`);};bindSupport(s,r);bindNav();if(r.solved){feedback(`<strong>Resolvido.</strong> ${esc(s.why)}`,true);$("next").disabled=false;}}
function renderOrder(s){const r=rec(s.id);if(!Array.isArray(r.order)||r.order.length!==s.blocks.length)r.order=[...s.start];const items=r.order.map((blockIndex,pos)=>`<div class="order-item"><div class="order-code">${esc(s.blocks[blockIndex])}</div><div class="order-buttons"><button data-up="${pos}" aria-label="Mover bloco para cima" ${pos===0?"disabled":""}>↑</button><button data-down="${pos}" aria-label="Mover bloco para baixo" ${pos===r.order.length-1?"disabled":""}>↓</button></div></div>`).join("");frame(s,`${s.mission?'<div class="mission"><span class="badge">MISSÃO FINAL</span><p>Organize os blocos para formar um programa coerente com dois caminhos.</p></div>':'<p>Use as setas <strong>↑</strong> e <strong>↓</strong> para colocar os blocos na ordem correta.</p>'}<div class="order-list">${items}</div><div class="actions"><button id="check" class="primary">Conferir ordem</button></div>${supportButtons(s,r)}<div id="feedback" class="feedback" role="status" aria-live="polite"></div>${nextNav(s,r.solved)}`);document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const p=Number(b.dataset.up);[r.order[p-1],r.order[p]]=[r.order[p],r.order[p-1]];save();renderOrder(s);});document.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>{const p=Number(b.dataset.down);[r.order[p],r.order[p+1]]=[r.order[p+1],r.order[p]];save();renderOrder(s);});$("check").onclick=()=>{const okOrder=r.order.every((v,i)=>v===s.correct[i]);const ok=registerResult(s,okOrder?1:0,1,r.order.join(","));if(ok){feedback(s.mission?"<strong>Missão concluída!</strong> Você montou um programa que escolhe entre dois caminhos.":"<strong>Ordem correta!</strong>",true);$("next").disabled=false;}else feedback("Ainda não está na ordem correta. Use a pista ou mova os blocos e tente novamente.");};bindSupport(s,r);bindNav();if(r.solved){feedback(s.mission?"Missão final concluída!":"Ordem resolvida.",true);$("next").disabled=false;}}
function renderPractice(s){frame(s,`<p>Agora teste o mesmo programa em um compilador C. Você pode baixar o arquivo pronto e observar o resultado com três valores.</p>${code(fullProgram)}<div class="actions"><button id="downloadC" class="primary">Baixar arquivo C</button></div><div class="checklist"><label class="checkitem"><input id="testThree" type="checkbox" ${state.practice.three?"checked":""}> Testei com <strong>3</strong> e apareceu “Vamos continuar coletando!”</label><label class="checkitem"><input id="testFive" type="checkbox" ${state.practice.five?"checked":""}> Testei com <strong>5</strong> e apareceu “Vamos continuar coletando!”</label><label class="checkitem"><input id="testEight" type="checkbox" ${state.practice.eight?"checked":""}> Testei com <strong>8</strong> e apareceu “Boa coleta!”</label></div><p class="tip">Esses testes são autodeclarados. Marque somente o que você realmente executou.</p>${nextNav(s)}`);$("downloadC").onclick=()=>{state.practice.downloaded=true;save();download("dois_caminhos_coleta.c",fullProgram);};[["testThree","three"],["testFive","five"],["testEight","eight"]].forEach(([id,key])=>$(id).onchange=e=>{state.practice[key]=e.target.checked;save();});bindNav();}
function renderReflection(s){const choices=["Entendi melhor o if","Entendi para que serve o else","Consegui prever qual mensagem aparece","Consegui montar o código"];frame(s,`<p>Antes de terminar, conte como foi esta atividade para você.</p><label class="block" for="autonomy">Quanto você conseguiu fazer sozinho?</label><select id="autonomy"><option value="">Escolha</option><option ${state.reflection.autonomy==="sozinho"?"selected":""} value="sozinho">Consegui fazer quase tudo sozinho</option><option ${state.reflection.autonomy==="alguma-ajuda"?"selected":""} value="alguma-ajuda">Precisei de alguma ajuda</option><option ${state.reflection.autonomy==="muita-ajuda"?"selected":""} value="muita-ajuda">Precisei de bastante ajuda</option></select><p><strong>O que ficou mais fácil?</strong></p><div class="options">${choices.map((x,i)=>`<label class="option"><input type="checkbox" data-easy="${i}" ${state.reflection.easiest.includes(x)?"checked":""}><span>${esc(x)}</span></label>`).join("")}</div><label class="block" for="note">Quer contar algo ao professor? (opcional)</label><textarea id="note" maxlength="500">${esc(state.reflection.note||"")}</textarea>${nextNav(s)}`);$("autonomy").onchange=e=>{state.reflection.autonomy=e.target.value;save();};document.querySelectorAll("[data-easy]").forEach(el=>el.onchange=()=>{state.reflection.easiest=choices.filter((_,i)=>document.querySelector(`[data-easy="${i}"]`).checked);save();});$("note").oninput=e=>{state.reflection.note=e.target.value;save();};bindNav();}
function situation(s,r){if(!r||!r.attempts)return"não conferida";if(r.solved)return r.attempts===1?"resolvida na primeira conferência":"resolvida após novas tentativas";return"ainda não resolvida";}
function currentScore(){let earned=0,solved=0,tasks=0,hints=0,helps=0;scored.forEach(s=>{const r=state.records[s.id];tasks++;earned+=Number(r?.firstScore||0);if(r?.solved)solved++;hints+=Number(r?.hints||0);helps+=Number(r?.helps||0);});return{earned,total:totalPoints,percent:totalPoints?Math.round(earned*100/totalPoints):0,solved,totalTasks:tasks,hints,helps};}
function categoryStats(){const out={};scored.forEach(s=>{const k=s.category||"Outros";if(!out[k])out[k]={earned:0,total:0,solved:0,tasks:0};const r=state.records[s.id];out[k].earned+=Number(r?.firstScore||0);out[k].total+=s.points||1;out[k].solved+=r?.solved?1:0;out[k].tasks++;});return out;}
function summaryText(){const t=currentScore();const lines=[TITULO.toUpperCase(),"Professor: Cristhiano Vasconcellos","Estudante: "+(state.studentName||"Não informado"),"Gerado em: "+new Date().toLocaleString("pt-BR"),"","PONTUAÇÃO NA PRIMEIRA CONFERÊNCIA: "+t.earned+"/"+t.total+" — "+t.percent+"%","Atividades resolvidas ao final: "+t.solved+"/"+t.totalTasks,"Pistas consultadas: "+t.hints,"Usos do botão Não lembro: "+t.helps,"Testes na Máquina dos dois caminhos: "+state.machine.tests,"Valores testados na máquina: "+(state.machine.values.join(", ")||"nenhum"),"","PRÁTICA EM C","Arquivo C baixado: "+(state.practice.downloaded?"sim":"não"),"Teste com 3: "+(state.practice.three?"declarado pelo estudante":"não marcado"),"Teste com 5: "+(state.practice.five?"declarado pelo estudante":"não marcado"),"Teste com 8: "+(state.practice.eight?"declarado pelo estudante":"não marcado"),"","AUTOPERCEPÇÃO","Autonomia declarada: "+(state.reflection.autonomy||"não marcada"),"Ficou mais fácil: "+((state.reflection.easiest||[]).join(", ")||"não marcado"),"Comentário: "+(state.reflection.note||"sem comentário"),"","DETALHAMENTO DAS TAREFAS"];scored.forEach((s,i)=>{const r=state.records[s.id];lines.push(`${i+1}. ${s.title} [${s.category}]`,`Situação: ${situation(s,r)}`,`Primeira conferência: ${r?.firstScore??0}/${s.points||1}`,`Tentativas de conferência: ${r?.attempts||0}`,`Pistas: ${r?.hints||0} | Não lembro: ${r?.helps||0}`);(r?.history||[]).forEach((h,j)=>lines.push(`  Tentativa ${j+1}: ${h.score}/${h.max} — ${h.correct?"correta":"ainda não completa"}`));lines.push("");});lines.push("OBSERVAÇÃO PEDAGÓGICA","A pontuação registra a primeira conferência. O estudante pode continuar tentando até resolver, permitindo observar tanto o desempenho inicial quanto a aprendizagem após pistas e novas tentativas.");return lines.join("\n");}
function showSummary(){if(sending)return;const t=currentScore(),cats=categoryStats();const rows=Object.entries(cats).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.earned}/${v.total}</td><td>${v.solved}/${v.tasks}</td></tr>`).join("");const dummy={title:"Seu percurso",phase:null};frame(dummy,`<p>Na primeira conferência, você fez <strong>${t.earned} de ${t.total} pontos (${t.percent}%)</strong>.</p><p>Depois das novas tentativas, você resolveu <strong>${t.solved} de ${t.totalTasks}</strong> tarefas.</p><div class="table-wrap"><table><thead><tr><th>Tipo de atividade</th><th>Primeira conferência</th><th>Resolvidas ao final</th></tr></thead><tbody>${rows}</tbody></table></div><p>Você consultou <strong>${t.hints}</strong> pista(s) e usou <strong>${t.helps}</strong> vez(es) o botão “Não lembro”.</p><p class="small">Esses dados ajudam o professor a perceber o que já está firme e onde ainda vale praticar.</p><form id="formResumo" class="no-print"><label class="block" for="studentName">Seu nome:</label><input id="studentName" type="text" required maxlength="120" autocomplete="name" value="${esc(state.studentName||"")}"><p class="small">O resumo registra respostas, tentativas, pistas, tipos de tarefa, prática e autoavaliação.</p><div class="actions"><button id="sendReport" type="submit" class="primary">Enviar resumo ao professor</button></div><p id="sendMessage" class="feedback" role="status" aria-live="polite"></p></form><div class="actions"><button id="return">Voltar à atividade</button><button id="downloadReport">Baixar resumo</button><button id="printReport">Imprimir resumo</button></div><details class="no-print"><summary>Retomar uma etapa</summary><label class="block" for="jump">Escolha a etapa:</label><select id="jump">${screens.map((s,i)=>`<option value="${i}" ${state.page===i?"selected":""}>${i+1}. ${esc(s.title)}</option>`).join("")}</select><button id="go">Abrir etapa</button></details>`,false);const name=$("studentName");const saveName=()=>{state.studentName=name.value.trim();save();};name.oninput=saveName;$("return").onclick=render;$("downloadReport").onclick=()=>{saveName();download("resumo_dois_caminhos_coleta_c.txt",summaryText());};$("printReport").onclick=()=>{saveName();window.print();};$("go").onclick=()=>{state.page=Number($("jump").value);save();render();};$("formResumo").onsubmit=async e=>{e.preventDefault();if(sending)return;saveName();const message=$("sendMessage"),button=$("sendReport");if(!state.studentName){message.textContent="Digite seu nome antes de enviar.";name.focus();return;}if(!/^https?:$/.test(location.protocol)){message.textContent="Abra a atividade pelo link do site para enviar. Se estiver usando o arquivo no computador, baixe o resumo.";return;}const student=state.studentName,report=summaryText(),controls=Array.from(document.querySelectorAll("button,input,select,textarea")).map(el=>[el,el.disabled]);controls.forEach(([el])=>el.disabled=true);sending=true;button.textContent="Enviando...";message.className="feedback";message.textContent="Aguarde enquanto o resumo é enviado.";const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),25000);let accepted=false;try{const response=await fetch("https://formsubmit.co/ajax/"+DESTINO,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},signal:controller.signal,body:JSON.stringify({_subject:"Programação I — Dois caminhos na coleta — "+student,_template:"table",_url:location.href.split("#")[0],estudante:student,atividade:TITULO,pontuacao:t.earned+"/"+t.total+" ("+t.percent+"%)",pistas:t.hints,nao_lembro:t.helps,resumo:report})});let data=null;try{data=await response.json();}catch(_){data=null;}if(!response.ok)throw new Error(data?.message||data?.error||("HTTP "+response.status));if(data?.success!==true&&data?.success!=="true")throw new Error(data?.message||data?.error||"Envio não confirmado pelo FormSubmit");accepted=true;message.className="feedback good";message.textContent="O serviço recebeu seu resumo para encaminhar ao professor. Você também pode baixar uma cópia.";}catch(error){message.className="feedback";const detail=error?.name==="AbortError"?"Tempo de espera excedido.":(error?.message||"Erro desconhecido.");message.textContent="Não foi possível confirmar o envio. FormSubmit informou: "+detail+" Baixe o resumo para não perdê-lo e tente novamente.";}finally{clearTimeout(timeout);sending=false;controls.forEach(([el,disabled])=>el.disabled=disabled);button.disabled=accepted;button.textContent=accepted?"Resumo encaminhado":"Tentar enviar novamente";}};}
function start(){if(resumeAvailable){const s={title:"Vamos continuar?",phase:null};frame(s,`<p>Existe um percurso salvo desta atividade neste navegador.</p><p>Você estava na etapa <strong>${Math.max(1,Math.min(state.page+1,screens.length))} de ${screens.length}</strong>.</p><div class="actions"><button id="resume" class="primary">Continuar meu percurso</button><button id="newAttempt">Começar novamente</button></div>`,false);$("resume").onclick=render;$("newAttempt").onclick=()=>$("restartDialog").showModal();}else render();}
$("summaryButton").onclick=showSummary;$("restartButton").onclick=()=>{if(!sending)$("restartDialog").showModal();};$("cancelRestart").onclick=()=>$("restartDialog").close();$("confirmRestart").onclick=()=>{if(sending)return;state=fresh();resumeAvailable=false;save();$("restartDialog").close();render();};$("indexLink").onclick=e=>{if(sending)e.preventDefault();};start();
})();
</script>
