<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Somando uma coleta — Programação I</title>

<style>
:root{
  --bg:#f3f6f5;
  --paper:#fff;
  --ink:#20352f;
  --muted:#52665e;
  --green:#16634d;
  --soft:#eaf5ef;
  --line:#cbd9d2;
  --amber:#fff4db;
  --amberline:#ad7300;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:19px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
}
button,input,select{font:inherit}
button,.button{
  cursor:pointer;border:1px solid var(--line);border-radius:10px;
  padding:11px 19px;background:white;color:var(--ink);
  min-height:48px;
}
button:hover,.button:hover{
  border-color:var(--green);background:var(--soft);
}
button:disabled{cursor:default;opacity:.55}
button.primary{
  background:var(--green);color:white;border-color:var(--green);
}
:focus-visible{outline:3px solid #b06900;outline-offset:4px}
header,main,footer{max-width:900px;margin:auto;padding:22px}
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
}
.brand{font-size:16px;font-weight:750;letter-spacing:.03em}
.teacher{
  display:block;margin-top:3px;color:var(--muted);
  font-size:15px;font-weight:500;letter-spacing:0;
}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{font-size:15px;padding:8px 12px}
main{padding-top:4px}
.card{
  background:var(--paper);border:1px solid var(--line);
  border-radius:18px;padding:clamp(22px,5vw,42px);
  box-shadow:0 8px 30px #20352f08;
}
h1{
  font-size:clamp(27px,4vw,37px);line-height:1.2;
  margin:8px 0 22px;
}
h2{font-size:23px;line-height:1.3}
p{margin:14px 0}
.eyebrow,.small{font-size:15px;color:var(--muted)}
progress{
  width:100%;height:10px;accent-color:var(--green);
  margin:8px 0 19px;
}
pre{
  background:#182b25;color:#f4faf6;padding:20px;border-radius:12px;
  overflow:auto;line-height:1.65;font-size:18px;tab-size:4;
}
code{font-family:Consolas,"Liberation Mono",monospace}
p code,label code,li code{
  background:var(--soft);padding:2px 6px;border-radius:4px;
}
.visual{
  display:flex;align-items:center;justify-content:center;
  gap:14px;flex-wrap:wrap;margin:25px 0;
}
.box{
  border:2px solid var(--line);border-radius:12px;
  padding:14px 18px;text-align:center;min-width:125px;
}
.box strong{display:block;font-size:34px}
.box .tag{font:18px Consolas,monospace;color:var(--green)}
.box .small{display:block}
.symbol{font-size:30px;color:var(--green)}
.note{
  background:var(--soft);border-left:4px solid var(--green);
  padding:14px 18px;border-radius:5px;
}
.options{display:grid;gap:11px;margin:22px 0}
.option{
  display:flex;align-items:center;gap:13px;
  border:2px solid var(--line);border-radius:10px;
  padding:14px;cursor:pointer;margin-bottom:10px;
}
.option:has(input:checked){
  border-color:var(--green);background:var(--soft);
}
input[type=radio],input[type=checkbox]{
  width:22px;height:22px;accent-color:var(--green);flex-shrink:0;
}
input[type=number]{
  width:150px;padding:10px;border:2px solid var(--line);
  border-radius:8px;
}
input[type=text]{
  width:100%;padding:12px;border:2px solid var(--line);
  border-radius:8px;
}
select{
  max-width:100%;padding:10px;border:2px solid var(--line);
  border-radius:8px;background:white;color:var(--ink);
}
.match{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  align-items:center;gap:12px;margin:15px 0;
}
.match label{overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.feedback{
  margin-top:20px;padding:16px 18px;border-radius:10px;
  background:var(--amber);border-left:5px solid var(--amberline);
}
.feedback.good{background:var(--soft);border-color:var(--green)}
.feedback:empty{display:none}
nav{
  display:flex;justify-content:space-between;gap:14px;margin-top:26px;
}
nav button{min-width:125px}
.console{
  background:#182b25;color:#f4faf6;border-radius:12px;
  padding:20px;min-height:110px;white-space:pre-wrap;
  font-family:Consolas,monospace;
}
label.block{display:block;margin:18px 0 8px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{
  padding:12px 8px;text-align:left;border-bottom:1px solid var(--line);
  vertical-align:top;
}
.table-wrap{overflow:auto}
details{margin-top:20px}
summary{cursor:pointer;font-weight:600}
footer{font-size:14px;color:var(--muted);text-align:center}
footer a{color:var(--green)}
dialog{
  border:1px solid var(--line);border-radius:16px;
  max-width:480px;width:90%;padding:26px;color:var(--ink);
}
dialog::backdrop{background:#152a2477}
.print-only{display:none}
[hidden]{display:none!important}
@media(max-width:560px){
  body{font-size:18px}
  header,main{padding:14px}
  .match{grid-template-columns:1fr}
  .box{min-width:100px;padding:10px}
  .symbol{font-size:24px}
  pre{font-size:16px}
}
@media print{
  header,footer,nav,.actions,progress,.no-print{display:none!important}
  .print-only{display:block}
  body{background:white;font-size:12pt}
  main{max-width:none;padding:0}
  .card{border:0;box-shadow:none;padding:0}
  th,td{font-size:10pt}
  tr{break-inside:avoid}
}
</style>
</head>

<body>
<header>
  <div class="brand">
    PROGRAMAÇÃO I · C
    <span class="teacher">Prof. Cristhiano Vasconcellos</span>
  </div>
  <div class="tools">
    <button id="summaryButton">Meu percurso</button>
    <button id="restartButton">Recomeçar</button>
  </div>
</header>

<main id="main"></main>

<footer>
  <p id="storageNote">
    Seu progresso fica neste navegador. Você pode continuar depois.
  </p>
  <a href="index.html" id="indexLink">Voltar à lista de atividades</a>
</footer>

<dialog id="restartDialog">
  <h2>Começar uma nova tentativa?</h2>
  <p>O nome e as respostas desta atividade serão apagados deste
  navegador. Se quiser guardar o resultado, baixe o resumo antes.</p>
  <div class="actions">
    <button id="cancelRestart">Manter meu progresso</button>
    <button class="primary" id="confirmRestart">Apagar e recomeçar</button>
  </div>
</dialog>

<noscript>Ative o JavaScript do navegador para usar a atividade.</noscript>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const KEY = "soma-coleta-c-v1";
const DESTINO = "cristhiano.vasconcellos@iffarroupilha.edu.br";
const TITULO = "Somando uma coleta — variáveis e cálculos em C";

const esc = value => String(value).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])
);

const code = value => "<pre><code>" + esc(value) + "</code></pre>";
const C = String.raw;

function box(name, value, caption = "") {
  return `
    <div class="box">
      <span class="tag">${esc(name)}</span>
      <strong>${esc(value)}</strong>
      ${caption ? `<span class="small">${esc(caption)}</span>` : ""}
    </div>
  `;
}

function memory(a, b, total) {
  return `<div class="visual">
    ${box("manha", a)}
    ${box("tarde", b)}
    ${box("total", total)}
  </div>`;
}

const program = C`#include <stdio.h>

int main() {
    int manha;
    int tarde;
    int total;

    printf("Latinhas da manha: ");
    scanf("%d", &manha);

    printf("Latinhas da tarde: ");
    scanf("%d", &tarde);

    total = manha + tarde;

    printf("Total coletado: %d\n", total);

    return 0;
}`;

const fresh = () => ({
  version:1,
  page:0,
  studentName:"",
  started:new Date().toISOString(),
  records:{},
  sim:{stage:0,manha:"",tarde:""},
  tests:{first:false,second:false}
});

let state = fresh();
let resumeAvailable = false;
let storageAvailable = true;
let sending = false;

try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (
    saved && saved.version === 1 &&
    Number.isInteger(saved.page) &&
    saved.records && typeof saved.records === "object"
  ) {
    state = {...fresh(), ...saved};
    state.sim = {...fresh().sim, ...saved.sim};
    state.tests = {...fresh().tests, ...saved.tests};
    state.studentName =
      typeof saved.studentName === "string" ? saved.studentName : "";
    resumeAvailable = true;
  }
} catch (_) {}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (_) {
    storageAvailable = false;
  }
}

function record(id) {
  if (!state.records[id] || typeof state.records[id] !== "object") {
    state.records[id] = {};
  }
  const r = state.records[id];
  r.attempts = Number.isInteger(r.attempts) ? r.attempts : 0;
  r.hints = Number.isInteger(r.hints) ? r.hints : 0;
  r.answers = Array.isArray(r.answers) ? r.answers : [];
  r.history = Array.isArray(r.history) ? r.history : [];
  r.solved = r.solved === true;
  return r;
}

function download(name, text) {
  const url = URL.createObjectURL(
    new Blob([text], {type:"text/plain;charset=utf-8"})
  );
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const screens = [
  {
    title:"Vamos juntar duas coletas",
    kind:"read",
    body:() => `
      <p>A equipe recolheu latinhas pela <strong>manhã</strong>
      e pela <strong>tarde</strong>.</p>

      <div class="visual">
        ${box("Manhã", 8)}
        <span class="symbol" aria-hidden="true">+</span>
        ${box("Tarde", 5)}
        <span class="symbol" aria-hidden="true">=</span>
        ${box("Total", 13)}
      </div>

      <p>Vamos fazer o programa receber as duas quantidades,
      somar e mostrar o total.</p>

      <p class="note">
        Primeiro, vamos relembrar algumas ideias.
        Faça no seu ritmo: você pode parar e continuar depois.
      </p>
    `
  },

  {
    id:"variable",
    title:"Vamos relembrar: variável",
    kind:"quiz",
    objective:"Compreender a função de uma variável",
    prompt:"Para que serve uma variável no programa?",
    options:[
      "Guardar um valor.",
      "Mostrar sempre uma mensagem.",
      "Encerrar o programa."
    ],
    correct:[0],
    why:"Uma variável é um espaço identificado por um nome que pode guardar um valor.",
    hint:"Na atividade anterior, latinhas guardava a quantidade digitada."
  },

  {
    id:"input",
    title:"Vamos relembrar: entrada",
    kind:"quiz",
    objective:"Reconhecer scanf como entrada",
    prompt:"Qual comando recebe um número digitado pelo teclado?",
    options:["printf","scanf","int"],
    correct:[1],
    why:"scanf lê o número digitado. printf mostra informações. int é usado para declarar uma variável inteira.",
    hint:"O comando de entrada começa com scan."
  },

  {
    title:"Um nome para cada quantidade",
    kind:"read",
    body:() => `
      <p>Vamos usar três variáveis:</p>

      <div class="visual">
        ${box("manha", "—", "quantidade da manhã")}
        ${box("tarde", "—", "quantidade da tarde")}
        ${box("total", "—", "resultado da soma")}
      </div>

      ${code(C`int manha;
int tarde;
int total;`)}

      <p><code>int</code> indica que vamos guardar
      <strong>números inteiros</strong>.</p>

      <p class="small">
        Declarar essas variáveis não coloca automaticamente zero nelas.
        Cada uma ainda precisa receber um valor.
        No código, escrevemos manha sem acento.
      </p>
    `
  },

  {
    id:"names",
    title:"Escolha a variável",
    kind:"quiz",
    objective:"Relacionar o nome à quantidade",
    prompt:"Qual variável escolhemos para guardar as latinhas da tarde?",
    options:["total","manha","tarde"],
    correct:[2],
    why:"Escolhemos tarde para a quantidade da tarde. Nomes que descrevem o valor ajudam a entender o programa.",
    hint:"O nome da variável é o mesmo período do dia citado na pergunta."
  },

  {
    title:"O sinal = guarda um valor",
    kind:"read",
    body:() => `
      ${code("manha = 8;")}

      <p>Leia assim: <strong>manha recebe 8</strong>.</p>

      <div class="visual">
        ${box("Valor", 8)}
        <span class="symbol" aria-hidden="true">→</span>
        ${box("manha", 8)}
      </div>

      <p>O valor da direita é guardado na variável da esquerda.</p>

      <p class="note">
        Neste comando, <code>=</code> faz uma
        <strong>atribuição</strong>: coloca um valor na variável.
      </p>
    `
  },

  {
    id:"assignment",
    title:"Leia a atribuição",
    kind:"quiz",
    objective:"Interpretar uma atribuição simples",
    prompt:"O que esta linha faz?",
    snippet:"tarde = 5;",
    options:[
      "Mostra 5 na tela.",
      "Guarda 5 na variável tarde.",
      "Lê um número do teclado."
    ],
    correct:[1],
    why:"tarde = 5; guarda o valor 5 na variável tarde. A linha não mostra uma mensagem nem espera uma digitação.",
    hint:"Leia o sinal = como recebe: tarde recebe 5."
  },

  {
    id:"stored",
    title:"Qual valor ficou guardado?",
    kind:"quiz",
    objective:"Identificar o valor após a atribuição",
    prompt:"Depois desta linha, qual valor está em total?",
    snippet:"total = 8;",
    options:["0","13","8"],
    correct:[2],
    why:"A linha coloca 8 em total. O nome total não realiza uma soma sozinho: o programa faz o que está escrito.",
    hint:"Observe o número à direita do sinal =."
  },

  {
    title:"O sinal + faz a soma",
    kind:"read",
    body:() => `
      <p>Em C, usamos <code>+</code> para somar.</p>

      <div class="visual">
        ${box("Manhã", 8)}
        <span class="symbol" aria-hidden="true">+</span>
        ${box("Tarde", 5)}
        <span class="symbol" aria-hidden="true">=</span>
        ${box("Resultado", 13)}
      </div>

      ${code("total = 8 + 5;")}

      <p>O programa <strong>calcula 8 + 5</strong>
      e depois <strong>guarda 13 em total</strong>.</p>

      <p class="note">
        Primeiro calcula. Depois guarda o resultado.
      </p>
    `
  },

  {
    id:"sum",
    title:"Calcule e guarde",
    kind:"quiz",
    objective:"Compreender soma seguida de atribuição",
    prompt:"Qual valor será guardado em total?",
    snippet:"total = 8 + 5;",
    options:["13","85","5"],
    correct:[0],
    why:"8 + 5 resulta em 13. A variável total recebe esse resultado. Com números inteiros, + faz uma soma.",
    hint:"Junte as duas quantidades: oito latinhas e mais cinco latinhas."
  },

  {
    id:"zero",
    title:"E quando uma coleta é zero?",
    kind:"quiz",
    objective:"Interpretar zero como quantidade",
    prompt:"De manhã não houve coleta. À tarde foram 4 latinhas. Qual é o total?",
    snippet:"total = 0 + 4;",
    options:["0","4","40"],
    correct:[1],
    why:"Zero representa nenhuma latinha de manhã. Somando as 4 da tarde, o total é 4.",
    hint:"Se nenhuma latinha foi acrescentada de manhã, continuam as quatro da tarde."
  },

  {
    title:"Também podemos somar variáveis",
    kind:"read",
    body:() => `
      <p><code>manha</code> guarda 8 e <code>tarde</code> guarda 5.</p>

      ${code("total = manha + tarde;")}

      <p>O programa usa os <strong>valores guardados</strong>:
      calcula 8 + 5 e coloca 13 em <code>total</code>.</p>

      ${memory(8,5,13)}

      <p class="note">
        Essa linha não altera manha nem tarde.
        Ela guarda o resultado em total.
      </p>
    `
  },

  {
    id:"variable_sum",
    title:"Use os valores das variáveis",
    kind:"quiz",
    objective:"Somar valores guardados em variáveis",
    prompt:"manha guarda 6 e tarde guarda 4. Qual valor total recebe?",
    snippet:"total = manha + tarde;",
    visual:memory(6,4,"?"),
    options:["6","64","10"],
    correct:[2],
    why:"O programa usa 6 no lugar de manha e 4 no lugar de tarde. Como 6 + 4 = 10, total recebe 10.",
    hint:"Substitua os nomes pelos valores: total recebe 6 + 4."
  },

  {
    id:"preserve",
    title:"Observe qual variável mudou",
    kind:"quiz",
    objective:"Identificar o destino da atribuição",
    prompt:"manha guarda 8 e tarde guarda 5. Depois da soma abaixo, quanto manha continua guardando?",
    snippet:"total = manha + tarde;",
    options:["13","8","5"],
    correct:[1],
    why:"manha continua guardando 8. A variável que recebe um novo valor é total, à esquerda de =.",
    hint:"Olhe o nome à esquerda de =. É essa variável que recebe o resultado."
  },

  {
    id:"associate",
    title:"Associe nome e significado",
    kind:"match",
    objective:"Distinguir entradas e resultado",
    prompt:"Escolha o significado de cada variável.",
    rows:["manha","tarde","total"],
    options:[
      "Resultado da soma das duas coletas",
      "Quantidade coletada pela manhã",
      "Quantidade coletada à tarde"
    ],
    correct:[1,2,0],
    why:"manha guarda a coleta da manhã. tarde guarda a coleta da tarde. total guarda a soma das duas.",
    hint:"Associe primeiro manha e tarde aos períodos do dia. O resultado fica em total."
  },

  {
    title:"Calcular e mostrar são ações diferentes",
    kind:"read",
    body:() => `
      ${code(C`total = manha + tarde;
printf("Total coletado: %d", total);`)}

      <p>A primeira linha <strong>calcula e guarda</strong> o total.</p>
      <p>A segunda linha <strong>mostra</strong> o total na tela.</p>

      <p class="small">Se total guarda 13, aparece:</p>
      <div class="console">Total coletado: 13</div>

      <p class="note">
        Fazer o cálculo não mostra o resultado automaticamente.
        Para mostrar, usamos printf.
      </p>
    `
  },

  {
    id:"output",
    title:"Qual mensagem aparece?",
    kind:"quiz",
    objective:"Interpretar a saída do resultado",
    prompt:"total guarda 19. O que aparece na tela?",
    snippet:'printf("Total coletado: %d", total);',
    options:[
      "Total coletado: total",
      "Total coletado: %d",
      "Total coletado: 19"
    ],
    correct:[2],
    why:"printf mostra o valor de total no lugar de %d. Como o valor é 19, aparece Total coletado: 19.",
    hint:"Substitua %d pelo número guardado em total."
  },

  {
    id:"complete",
    title:"Complete com a variável do resultado",
    kind:"fill",
    objective:"Usar a variável total no cálculo e na saída",
    prompt:"Queremos guardar a soma e mostrar o resultado. Complete as duas linhas.",
    rows:[
      "____ = manha + tarde;",
      'printf("Total coletado: %d", ____);'
    ],
    options:["total","manha","tarde"],
    correct:[0,0],
    why:"total recebe o resultado da soma. Depois, printf usa total para mostrar esse resultado.",
    hint:"Use nas duas lacunas o nome escolhido para o resultado da soma."
  },

  {
    id:"order",
    title:"Qual ação vem primeiro?",
    kind:"quiz",
    objective:"Compreender a ordem do cálculo e da saída",
    prompt:"As quantidades já foram recebidas. O que devemos fazer antes de mostrar total?",
    options:[
      "Calcular a soma e guardar o resultado em total.",
      "Encerrar o programa.",
      "Mostrar total antes de ele receber o resultado."
    ],
    correct:[0],
    why:"Primeiro total precisa receber o resultado da soma. Só depois mostramos esse valor.",
    hint:"Para mostrar um resultado, precisamos calculá-lo antes."
  },

  {
    title:"Acompanhe as duas coletas",
    kind:"sim",
    body:() => `
      <p>Execute uma etapa por vez e observe as variáveis.</p>

      <p class="small">
        Simulação guiada deste programa; não é um compilador.
      </p>

      <div id="simCode"></div>
      <div id="simMemory"></div>
      <div class="console" id="console" aria-live="polite"></div>

      <div id="inputArea" hidden>
        <label class="block" id="quantityLabel" for="quantity">
          Digite a quantidade:
        </label>
        <input id="quantity" type="number"
          min="0" max="99" step="1" inputmode="numeric">
      </div>

      <p id="simExplanation" class="note" aria-live="polite"></p>

      <div class="actions">
        <button id="simNext" class="primary">Executar próximo comando</button>
        <button id="simReset">Testar outras quantidades</button>
      </div>
    `
  },

  {
    id:"transfer",
    title:"Agora, outras quantidades",
    kind:"quiz",
    objective:"Aplicar o cálculo a novas entradas",
    prompt:"Foram digitadas 9 latinhas de manhã e 2 à tarde. Qual será a saída?",
    snippet:C`total = manha + tarde;
printf("Total coletado: %d", total);`,
    options:[
      "Total coletado: 92",
      "Total coletado: 11",
      "Total coletado: 13"
    ],
    correct:[1],
    why:"O programa soma as novas quantidades: 9 + 2 = 11. O resultado não fica preso aos números do exemplo anterior.",
    hint:"Use os números desta coleta: nove pela manhã e duas à tarde."
  },

  {
    id:"application",
    title:"Complete o programa da coleta",
    kind:"fill",
    objective:"Integrar entrada, cálculo e saída",
    prompt:"Escolha o trecho que falta em cada linha.",
    rows:[
      'scanf("%d", ____);',
      "____ = manha + tarde;",
      'printf("Total coletado: %d", ____);'
    ],
    context:"Na primeira linha, queremos receber a quantidade da manhã.",
    choices:[
      ["&total","&manha","&tarde"],
      ["tarde","manha","total"],
      ["total","&total",'"total"']
    ],
    correct:[1,2,0],
    why:"Na primeira linha, &manha indica onde guardar a entrada da manhã. Depois total recebe a soma. Por fim, printf mostra total sem &.",
    hint:"Primeira linha: receber a manhã. Segunda: guardar o resultado. Terceira: mostrar o resultado."
  },

  {
    title:"Agora execute seu programa em C",
    kind:"practice",
    body:() => `
      <p>Use o modelo no <strong>Dev-C++</strong>
      ou em um <strong>compilador online de C</strong>.</p>

      ${code(program)}

      <div class="actions">
        <button id="downloadC" class="primary">Baixar programa .c</button>
      </div>

      <p>Execute duas vezes e confira os resultados:</p>

      <label class="option">
        <input id="testFirst" type="checkbox"
          ${state.tests.first ? "checked" : ""}>
        <span>Digitei <strong>8</strong> e <strong>5</strong>.
        O programa mostrou <strong>13</strong>.</span>
      </label>

      <label class="option">
        <input id="testSecond" type="checkbox"
          ${state.tests.second ? "checked" : ""}>
        <span>Digitei <strong>12</strong> e <strong>7</strong>.
        O programa mostrou <strong>19</strong>.</span>
      </label>

      <p class="small">
        Marque somente depois de executar.
        A atividade não verifica o compilador.
      </p>

      <details>
        <summary>Preciso de ajuda para executar</summary>

        <p>No Dev-C++, salve com a extensão <code>.c</code>.
        Compile e execute. Digite a quantidade da manhã e pressione
        Enter. Depois faça o mesmo com a quantidade da tarde.</p>

        <p>Se o compilador online tiver um campo “Entrada” ou
        “stdin”, coloque um número em cada linha antes de executar.</p>

        <p>Confira especialmente os nomes das variáveis, os
        pontos e vírgulas e o <code>&amp;</code> nos dois scanf.</p>
      </details>

      <details>
        <summary>Relembrar as partes prontas do modelo</summary>

        <p><code>#include &lt;stdio.h&gt;</code> permite usar
        printf e scanf. O programa começa em <code>main</code>.
        As chaves delimitam o bloco.</p>

        <p><code>\\n</code> muda de linha.
        <code>return 0;</code> indica encerramento normal.</p>
      </details>
    `
  }
];

const questions = screens.filter(s => s.id);

questions.forEach(s => {
  if (state.records[s.id]) record(s.id);
});

function situation(r) {
  if (!r || !r.attempts) {
    return r?.answers?.some(a => a !== null && a !== undefined)
      ? "Selecionou; falta conferir"
      : "Ainda não respondeu";
  }

  if (!r.solved) return "Respondeu; precisa retomar";

  const hints = r.success?.hints ?? r.hints ?? 0;
  const attempt = r.success?.attempt ?? r.attempts;

  if (hints > 0) return "Resolveu com pista";
  if (attempt > 1) return "Resolveu após retorno explicativo";

  return "Resolveu na primeira tentativa, sem pista";
}

function totals() {
  return {
    total:questions.length,
    answered:questions.filter(s =>
      (state.records[s.id]?.attempts || 0) > 0
    ).length,
    solved:questions.filter(s =>
      state.records[s.id]?.solved === true
    ).length
  };
}

function register(r, answers, expected) {
  if (
    answers.length !== expected.length ||
    answers.some(a => a === null || a === undefined)
  ) return null;

  if (r.solved) return true;

  r.answers = [...answers];
  r.attempts++;

  const correct = answers.every((a,i) => a === expected[i]);

  r.history.push({
    answers:[...answers],
    correct,
    hints:r.hints,
    time:new Date().toISOString()
  });

  if (correct) {
    r.solved = true;
    r.success = {attempt:r.attempts, hints:r.hints};
  }

  return correct;
}

function frame(title, contents, progress = true) {
  $("main").innerHTML = `
    ${progress ? `
      <div class="eyebrow">Etapa ${state.page+1} de ${screens.length}</div>
      <progress aria-label="Posição na atividade"
        max="${screens.length}" value="${state.page+1}"></progress>
    ` : ""}

    <section class="card">
      <h1 id="heading" tabindex="-1">${title}</h1>
      ${contents}
    </section>
  `;

  $("storageNote").textContent = storageAvailable
    ? "Seu progresso fica neste navegador. Você pode continuar depois."
    : "O navegador não permitiu salvar. Baixe o resumo antes de fechar.";

  $("heading").focus({preventScroll:true});
  window.scrollTo(0,0);
}

function feedback(text, good = false) {
  $("feedback").className = "feedback" + (good ? " good" : "");
  $("feedback").textContent = text;
}

function fields(s,r) {
  if (s.kind === "quiz") {
    return `
      ${s.visual || ""}
      ${s.snippet ? code(s.snippet) : ""}

      <div class="options" role="radiogroup"
        aria-label="${esc(s.prompt)}">
        ${s.options.map((o,i) => `
          <label class="option">
            <input type="radio" name="answer" value="${i}"
              ${r.answers[0] === i ? "checked" : ""}
              ${r.solved ? "disabled" : ""}>
            <span>${esc(o)}</span>
          </label>
        `).join("")}
      </div>
    `;
  }

  return s.rows.map((row,i) => `
    <div class="match">
      <label for="answer${i}"><code>${esc(row)}</code></label>
      <select id="answer${i}" ${r.solved ? "disabled" : ""}>
        <option value="">Escolha uma opção</option>
        ${(s.choices?.[i] || s.options).map((o,j) => `
          <option value="${j}" ${r.answers[i] === j ? "selected" : ""}>
            ${esc(o)}
          </option>
        `).join("")}
      </select>
    </div>
  `).join("");
}

function capture(s) {
  if (s.kind === "quiz") {
    const selected = document.querySelector(
      'input[name="answer"]:checked'
    );
    return [selected ? Number(selected.value) : null];
  }

  return s.rows.map((_,i) =>
    $("answer"+i).value === "" ? null : Number($("answer"+i).value)
  );
}

function render() {
  state.page = Math.max(0,Math.min(state.page,screens.length-1));

  const s = screens[state.page];
  const r = s.id ? record(s.id) : null;

  const content = s.body ? s.body() : `
    <p>${esc(s.prompt)}</p>
    ${s.context ? `<p class="note">${esc(s.context)}</p>` : ""}
    ${fields(s,r)}

    <div class="actions">
      <button id="check" class="primary" ${r.solved ? "disabled" : ""}>
        Conferir resposta
      </button>
      <button id="hint" ${r.solved ? "disabled" : ""}>
        Quero uma pista
      </button>
    </div>

    <div id="feedback" class="feedback"
      role="status" aria-live="polite"></div>
  `;

  frame(s.title,content + `
    <nav aria-label="Navegação da atividade">
      <button id="back" ${state.page === 0 ? "disabled" : ""}>Voltar</button>
      <button id="next" class="primary">
        ${state.page === screens.length-1 ? "Ver meu resumo" : "Continuar"}
      </button>
    </nav>

    ${s.id ? `<p class="small">
      Você pode continuar mesmo sem acertar e voltar depois.
    </p>` : ""}
  `);

  $("back").onclick = () => {
    state.page--;
    save();
    render();
  };

  $("next").onclick = () => {
    if (state.page === screens.length-1) {
      save();
      showSummary();
      return;
    }
    state.page++;
    save();
    render();
  };

  if (s.id) {
    document.querySelectorAll(
      'input[name="answer"],select'
    ).forEach(el => {
      el.addEventListener("change",() => {
        r.answers = capture(s);
        save();
      });
    });

    $("check").onclick = () => {
      const answers = capture(s);
      const result = register(r,answers,s.correct);

      if (result === null) {
        feedback("Escolha uma opção em cada campo antes de conferir.");
        return;
      }

      save();

      if (result) {
        render();
        return;
      }

      const rows = answers.length > 1
        ? answers.map((a,i) =>
            "Linha "+(i+1)+": "+
            (a === s.correct[i] ? "correta." : "revise.")
          ).join(" ")+" "
        : "";

      feedback(
        rows+s.why+" Você pode mudar sua resposta e tentar novamente."
      );
    };

    $("hint").onclick = () => {
      r.hints++;
      save();
      feedback(s.hint);
    };

    if (r.solved) {
      feedback("Correto. "+s.why,true);
    } else if (r.attempts) {
      feedback(s.why+" Você pode tentar novamente.");
    }
  }

  if (s.kind === "sim") setupSimulation();

  if (s.kind === "practice") {
    $("downloadC").onclick = () =>
      download("soma_coleta.c",program);

    $("testFirst").onchange = e => {
      state.tests.first = e.target.checked;
      save();
    };

    $("testSecond").onchange = e => {
      state.tests.second = e.target.checked;
      save();
    };
  }
}

function setupSimulation() {
  const n = Math.max(0,Math.min(Number(state.sim.stage)||0,7));
  state.sim.stage = n;

  const a = state.sim.manha;
  const b = state.sim.tarde;
  const sum = Number(a)+Number(b);

  const morningOutput = "Latinhas da manha: "+a;
  const bothOutput = morningOutput+"\nLatinhas da tarde: "+b;

  const stages = [
    {
      line:C`int manha;
int tarde;
int total;`,
      text:"Vamos declarar as três variáveis. Elas ainda não foram criadas nesta simulação.",
      output:"O programa ainda não mostrou uma mensagem."
    },
    {
      line:'printf("Latinhas da manha: ");',
      text:"As variáveis foram declaradas e ainda precisam receber valores. Agora vamos mostrar o pedido da manhã.",
      output:"O programa ainda não mostrou uma mensagem."
    },
    {
      line:'scanf("%d", &manha);',
      text:"Digite a quantidade da manhã. scanf vai guardá-la em manha.",
      output:"Latinhas da manha: "
    },
    {
      line:'printf("Latinhas da tarde: ");',
      text:"manha recebeu "+a+". Agora vamos mostrar o pedido da tarde.",
      output:morningOutput
    },
    {
      line:'scanf("%d", &tarde);',
      text:"Digite a quantidade da tarde. scanf vai guardá-la em tarde.",
      output:morningOutput+"\nLatinhas da tarde: "
    },
    {
      line:"total = manha + tarde;",
      text:"As duas entradas estão guardadas. Agora vamos calcular "+
        a+" + "+b+" e guardar o resultado em total.",
      output:bothOutput
    },
    {
      line:C`printf("Total coletado: %d\n", total);`,
      text:"total recebeu "+sum+". manha e tarde mantiveram seus valores. Falta mostrar o resultado na tela.",
      output:bothOutput
    },
    {
      line:C`printf("Total coletado: %d\n", total);`,
      text:"printf mostrou "+sum+". Você pode testar outras quantidades ou continuar.",
      output:bothOutput+"\nTotal coletado: "+sum
    }
  ];

  $("simCode").innerHTML = code(stages[n].line);
  $("simMemory").innerHTML = memory(
    n >= 3 ? a : "—",
    n >= 5 ? b : "—",
    n >= 6 ? sum : "—"
  );
  $("console").textContent = stages[n].output;
  $("simExplanation").textContent = stages[n].text;

  const needsInput = n === 2 || n === 4;
  $("inputArea").hidden = !needsInput;

  $("quantityLabel").textContent =
    "Quantidade da "+(n === 2 ? "manhã" : "tarde")+" (0 a 99):";

  $("quantity").value = n === 2 ? a : b;

  $("simNext").disabled = n === 7;
  $("simNext").textContent = needsInput
    ? "Guardar número"
    : n === 7 ? "Simulação concluída" : "Executar próximo comando";

  $("simNext").onclick = () => {
    if (needsInput) {
      const value = $("quantity").value.trim();

      if (!/^\d{1,2}$/.test(value)) {
        $("simExplanation").textContent =
          "Digite um número inteiro de 0 a 99, sem vírgula ou ponto.";
        $("quantity").focus();
        return;
      }

      state.sim[n === 2 ? "manha" : "tarde"] =
        String(Number(value));
    }

    state.sim.stage = n+1;
    save();
    setupSimulation();

    if (state.sim.stage === 2 || state.sim.stage === 4) {
      $("quantity").focus();
    }
  };

  $("quantity").onkeydown = e => {
    if (e.key === "Enter") {
      e.preventDefault();
      $("simNext").click();
    }
  };

  $("simReset").onclick = () => {
    state.sim = {stage:0,manha:"",tarde:""};
    save();
    setupSimulation();
  };
}

function answerLabel(s,value,row) {
  if (value === null || value === undefined) return "Sem seleção";
  return (s.choices?.[row] || s.options)?.[value] ?? "Sem seleção";
}

function summaryText() {
  const t = totals();

  const lines = [
    TITULO.toUpperCase(),
    "Professor: Cristhiano Vasconcellos",
    "Estudante: "+(state.studentName || "Não informado"),
    "Gerado em: "+new Date().toLocaleString("pt-BR"),
    "",
    "Atividades respondidas: "+t.answered+"/"+t.total,
    "Atividades resolvidas: "+t.solved+"/"+t.total,
    "As telas de explicação não entram nesses totais.",
    ""
  ];

  questions.forEach((s,index) => {
    const r = state.records[s.id];

    lines.push(
      "QUESTÃO "+(index+1)+" — "+s.objective,
      "Enunciado: "+s.prompt
    );

    if (s.context) lines.push(s.context);
    if (s.snippet) lines.push("Código:\n"+s.snippet);
    if (s.rows) lines.push("Linhas:\n"+s.rows.join("\n"));

    lines.push(
      "Situação: "+situation(r),
      "Tentativas: "+(r?.attempts || 0),
      "Consultas a pistas: "+(r?.hints || 0)
    );

    (r?.history || []).forEach((h,i) => {
      lines.push(
        "Tentativa "+(i+1)+": "+
          h.answers.map((a,j) => answerLabel(s,a,j)).join(" | "),
        "Resultado: "+(h.correct ? "correto" : "incorreto"),
        "Pistas consultadas até então: "+(h.hints || 0)
      );
    });

    if (r?.answers?.length) {
      lines.push(
        "Seleção atual: "+
        r.answers.map((a,j) => answerLabel(s,a,j)).join(" | ")
      );
    }

    lines.push("");
  });

  lines.push(
    "Simulação: "+(state.sim.stage === 7 ? "concluída" : "não concluída"),
    "Teste 8 + 5 = 13: "+
      (state.tests.first ? "declarado pelo estudante" : "não marcado"),
    "Teste 12 + 7 = 19: "+
      (state.tests.second ? "declarado pelo estudante" : "não marcado"),
    "",
    "Os testes no compilador são autodeclarados.",
    "Os acertos não comprovam, sozinhos, domínio do conteúdo."
  );

  return lines.join("\n");
}

function showSummary() {
  if (sending) return;
  const t = totals();

  frame("Seu percurso",`
    <p>Você respondeu <strong>${t.answered} de ${t.total}</strong>
    atividades e resolveu <strong>${t.solved}</strong>.</p>

    <p class="small">
      As explicações não entram na contagem.
      Uma seleção vira tentativa ao clicar em “Conferir resposta”.
    </p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>O que praticou</th>
            <th>Registro</th>
            <th>Tentativas</th>
          </tr>
        </thead>
        <tbody>
          ${questions.map(s => `
            <tr>
              <td>${esc(s.objective)}</td>
              <td>${esc(situation(state.records[s.id]))}</td>
              <td>${state.records[s.id]?.attempts || 0}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>

    <p>Simulação:
      <strong>${state.sim.stage === 7 ? "concluída" : "ainda não concluída"}</strong>.
    </p>

    <p>Testes no compilador informados por você:
      <strong>${Number(state.tests.first)+Number(state.tests.second)} de 2</strong>.
    </p>

    <p id="printName" class="print-only">
      Estudante: ${esc(state.studentName || "Não informado")}
    </p>

    <form id="formResumo" class="no-print">
      <label class="block" for="studentName">Seu nome:</label>
      <input id="studentName" type="text" required maxlength="120"
        autocomplete="name" value="${esc(state.studentName || "")}">

      <p class="small">
        Ao enviar, seu nome, respostas, tentativas e consultas a pistas
        serão encaminhados ao professor pelo FormSubmit.
      </p>

      <div class="actions">
        <button id="sendReport" type="submit" class="primary">
          Enviar resumo ao professor
        </button>
      </div>

      <p id="sendMessage" class="feedback"
        role="status" aria-live="polite"></p>
    </form>

    <div class="actions">
      <button id="return">Voltar à atividade</button>
      <button id="downloadReport">Baixar resumo</button>
      <button id="printReport">Imprimir resumo</button>
    </div>

    <details class="no-print">
      <summary>Retomar uma etapa</summary>
      <label class="block" for="jump">Escolha uma etapa:</label>
      <select id="jump">
        ${screens.map((s,i) => `
          <option value="${i}" ${state.page === i ? "selected" : ""}>
            ${i+1}. ${esc(s.title)}
          </option>
        `).join("")}
      </select>
      <button id="go">Abrir etapa</button>
    </details>
  `,false);

  const name = $("studentName");

  function saveName() {
    state.studentName = name.value.trim();
    $("printName").textContent =
      "Estudante: "+(state.studentName || "Não informado");
    save();
  }

  name.oninput = saveName;
  $("return").onclick = render;

  $("downloadReport").onclick = () => {
    saveName();
    download("resumo_soma_coleta_c.txt",summaryText());
  };

  $("printReport").onclick = () => {
    saveName();
    window.print();
  };

  $("go").onclick = () => {
    state.page = Number($("jump").value);
    save();
    render();
  };

  $("formResumo").onsubmit = async event => {
    event.preventDefault();
    if (sending) return;

    saveName();

    const message = $("sendMessage");
    const button = $("sendReport");

    if (!state.studentName) {
      message.textContent = "Digite seu nome antes de enviar.";
      name.focus();
      return;
    }

    if (!/^https?:$/.test(location.protocol)) {
      message.textContent =
        "Abra a atividade pelo link do site para enviar. " +
        "Se estiver usando o arquivo no computador, baixe o resumo.";
      return;
    }

    const student = state.studentName;
    const report = summaryText();

    const controls = Array.from(
      document.querySelectorAll("button,input,select")
    ).map(el => [el,el.disabled]);

    controls.forEach(([el]) => el.disabled = true);

    sending = true;
    button.textContent = "Enviando...";
    message.className = "feedback";
    message.textContent = "Aguarde enquanto o resumo é enviado.";

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(),25000);
    let accepted = false;

    try {
      const response = await fetch(
        "https://formsubmit.co/ajax/"+DESTINO,
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Accept":"application/json"
          },
          signal:controller.signal,
          body:JSON.stringify({
            _subject:"Programação I — Soma da coleta — "+student,
            _template:"table",
            estudante:student,
            atividade:TITULO,
            resumo:report
          })
        }
      );

      if (!response.ok) throw new Error("Falha no serviço");

      const data = await response.json();

      if (data.success !== true && data.success !== "true") {
        throw new Error("Envio não confirmado");
      }

      accepted = true;
      message.className = "feedback good";
      message.textContent =
        "O serviço recebeu seu resumo para encaminhar ao professor. " +
        "Você também pode baixar uma cópia.";

    } catch (_) {
      message.className = "feedback";
      message.textContent =
        "Não foi possível confirmar o envio. Baixe o resumo para não " +
        "perdê-lo. Você pode tentar novamente; se a primeira tentativa " +
        "tiver sido recebida, o professor poderá receber duas cópias.";

    } finally {
      clearTimeout(timeout);
      sending = false;

      controls.forEach(([el,disabled]) => {
        el.disabled = disabled;
      });

      button.disabled = accepted;
      button.textContent = accepted
        ? "Resumo encaminhado"
        : "Tentar enviar novamente";
    }
  };
}

function start() {
  if (resumeAvailable) {
    frame("Vamos continuar?",`
      <p>Há um percurso salvo desta atividade neste navegador.</p>
      <p>Você estava na etapa
        <strong>${Math.max(1,Math.min(state.page+1,screens.length))}
        de ${screens.length}</strong>.
      </p>
      <div class="actions">
        <button id="resume" class="primary">Continuar meu percurso</button>
        <button id="newAttempt">Começar novamente</button>
      </div>
    `,false);

    $("resume").onclick = render;
    $("newAttempt").onclick = () => $("restartDialog").showModal();
  } else {
    render();
  }
}

$("summaryButton").onclick = showSummary;

$("restartButton").onclick = () => {
  if (!sending) $("restartDialog").showModal();
};

$("cancelRestart").onclick = () => $("restartDialog").close();

$("confirmRestart").onclick = () => {
  if (sending) return;
  state = fresh();
  resumeAvailable = false;
  save();
  $("restartDialog").close();
  render();
};

$("indexLink").onclick = event => {
  if (sending) event.preventDefault();
};

start();
})();
</script>
</body>
</html>
